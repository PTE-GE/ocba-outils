  // ------------------------------------------------------------------
  // Priorisation PTE (priorisation.csv, un des 2 CSV restants) — badge de rang
  // compact affiché partout où un projet apparaît. Non classé = badge
  // gris « — », jamais de rang par défaut.
  // ------------------------------------------------------------------
  var OBJ_PTE_LABELS = { co2: 'CO₂', th: 'Th', ren: 'Ren', elec: 'Élec', eau: 'Eau', pv: 'PV', veg: 'Vég' };
  var PRIO_MOTIF_LABEL = {
    sans_sous_site: 'projet sans n° de sous-site renseigné.',
    absent_export: 'sous-site absent du dernier export de priorisation.',

  };
  function rangBadge(numeroProjet) {

  }

  // ------------------------------------------------------------------
  // Import CSV (fonction unique, utilisée par le glisser-déposer, le
  // sélecteur de fichiers ET les tests automatisés). Depuis le switch
  // direct v0.7, seuls decisions.csv et priorisation.csv sont reconnus
  // (Engine.loadCSVText renvoie {type:null} pour tout le reste).
  // ------------------------------------------------------------------
  function loadCSVText(text, filename) {
    var res = Engine.loadCSVText(DB, text, filename);
    ensureMonth();
    saveState();
    renderAll();
    return res;
  }

  function clearData() {
    DB = Engine.createDB();
    try { localStorage.removeItem(LS_DB); } catch (e) { /* ignoré */ }
    STATE.mois = null; STATE.projetSel = null; STATE.perimetre = 'ALL';
    STATE.rep = { pf: null, projet: null, rp: '', statut: '', type: '', q: '', expanded: {} };
    renderAll();
  }

  function ensureMonth() {
    var moisDisp = Engine.moisDisponibles(DB);
    if (!STATE.mois || moisDisp.indexOf(STATE.mois) === -1) {
      STATE.mois = moisDisp.length ? moisDisp[moisDisp.length - 1] : null;
    }
  }

  // ------------------------------------------------------------------
  // Calculs de haut niveau réutilisés par les vues et par les tests
  // ------------------------------------------------------------------
  function computeAll() {
    if (!STATE.mois) return [];
    return Engine.computeAllProjects(DB, STATE.mois, PARAMS);
  }

  function currentYear() { return STATE.mois ? +STATE.mois.slice(0, 4) : new Date().getFullYear(); }

  function projetsByPerimetre(key) {
    var all = computeAll();
    if (!key || key === 'ALL') return all;
    if (key === 'HORS') return all.filter(function (c) { return !c.projet.rpf || !c.projet.rpf.trim(); });
    if (key.indexOf('RPF:') === 0) { var v = key.slice(4); return all.filter(function (c) { return c.projet.rpf === v; }); }
    if (key.indexOf('RP:') === 0) { var v2 = key.slice(3); return all.filter(function (c) { return c.projet.rp === v2; }); }
    return all;
  }

  function labelPerimetre(key) {
    if (!key || key === 'ALL') return 'tout le parc';
    if (key === 'HORS') return 'hors périmètre RPF';
    if (key.indexOf('RPF:') === 0) return 'RPF ' + key.slice(4);
    if (key.indexOf('RP:') === 0) return 'RP ' + key.slice(3);
    return key;
  }

  // Alignement priorisation du périmètre courant : restreint l'univers des
  // sous-sites « à proposer » au même périmètre RPF que la liste filtrée
  // (un RP n'a pas d'équivalent dans priorisation.csv : pas de restriction).
  function alignementForPerimetre(list, key) {
    var opts = {};
    if (key && key.indexOf('RPF:') === 0) { var v = key.slice(4); opts.filterRow = function (r) { return r.rpf === v; }; }
    else if (key === 'HORS') { opts.filterRow = function (r) { return !r.rpf || !r.rpf.trim(); }; }
    return Engine.alignementPerimetre(DB, list, PARAMS, opts);
  }

  function financeTotals(numeroProjets, annee) {
    var out = { objectif: 0, prevision: 0, engage: 0, depense: 0 };
    DB.finances.forEach(function (f) {
      if (numeroProjets.indexOf(f.numero_projet) === -1) return;
      if (+f.annee !== annee) return;
      var v = Engine.parseNum(f.montant_kchf) || 0;
      var nat = (f.nature || '').trim().toLowerCase();
      if (nat === 'objectif') out.objectif += v;
      else if (nat === 'prevision' || nat === 'prévision') out.prevision += v;
      else if (nat === 'engage' || nat === 'engagé') out.engage += v;
      else if (nat === 'depense' || nat === 'dépense') out.depense += v;
    });
    return out;
  }

  function pteGainsFor(numeroProjets) {
    var sousSites = DB.projets.filter(function (p) { return numeroProjets.indexOf(p.numero_projet) !== -1 && p.numero_sous_site; }).map(function (p) { return p.numero_sous_site; });
    var out = { gain_kwh_th: 0, gain_t_co2: 0, gain_kwh_el: 0, gain_m3_eau: 0, pv_kwc: 0, vegetalisation_m2: 0, estim_pte_kchf: 0, n: 0 };
    var seen = {};
    DB.pte.forEach(function (r) {
      if (sousSites.indexOf(r.numero_sous_site) === -1) return;
      if (seen[r.numero_sous_site]) return;
      seen[r.numero_sous_site] = true;
      out.n++;
      ['gain_kwh_th', 'gain_t_co2', 'gain_kwh_el', 'gain_m3_eau', 'pv_kwc', 'vegetalisation_m2', 'estim_pte_kchf'].forEach(function (k) {
        out[k] += Engine.parseNum(r[k]) || 0;
      });
    });
    return out;
  }

  function nextJalon(numeroProjet, fromDate) {
    var jal = DB.jalons.filter(function (j) { return j.numero_projet === numeroProjet && !j.date_realisee; });
    var upcoming = jal.map(function (j) { return { j: j, d: Engine.parseDate(j.date_prevue) }; })
      .filter(function (x) { return x.d && Engine.dayDiff(x.d, fromDate) >= 0; })
      .sort(function (a, b) { return a.d - b.d; });
    return upcoming.length ? upcoming[0].j : null;
  }

  function motifPrincipal(c) {
    if (c.sems.fraicheur.color === 'gris') return 'Non mis à jour ce mois';
    var labels = { delais: 'Délais', depenses: 'Dépenses', livrables: 'Livrables', risques: 'Risques' };
    var hits = ['delais', 'depenses', 'livrables', 'risques'].filter(function (k) { return c.sems[k].color === c.global; }).map(function (k) { return labels[k]; });
    return hits.length ? hits.join(', ') : 'À surveiller';
  }

  // ------------------------------------------------------------------
  // Export CSV générique
  // ------------------------------------------------------------------
  function buildCSVString(headers, rows) {
    function e(v) { v = v === null || v === undefined ? '' : String(v); return (v.indexOf(';') !== -1 || v.indexOf('"') !== -1 || v.indexOf('\n') !== -1) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var lines = [headers.join(';')];
    rows.forEach(function (r) { lines.push(headers.map(function (h) { return e(r[h]); }).join(';')); });
    return '﻿' + lines.join('\r\n') + '\r\n';
  }
  function downloadCSV(filename, headers, rows) {
    var content = buildCSVString(headers, rows);
    try {
      var blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) { /* environnement sans téléchargement (tests) */ }
    return content;
  }

  // ------------------------------------------------------------------
  // Graphiques SVG (aucune bibliothèque) — marques fines, survol systématique
  // ------------------------------------------------------------------
  var SVGNS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }

  function donutSVG(pct, color, opts) {
    opts = opts || {};
    var size = opts.size || 72, stroke = opts.stroke || 8;
    var r = (size - stroke) / 2, c = size / 2;
    var circumf = 2 * Math.PI * r;
    var p = Math.max(0, Math.min(100, pct || 0));
    var dash = circumf * p / 100;
    var s = svg('svg', { class: 'chart', width: size, height: size, viewBox: '0 0 ' + size + ' ' + size });
    s.appendChild(svg('circle', { cx: c, cy: c, r: r, fill: 'none', stroke: '#EEF1F3', 'stroke-width': stroke }));
    if (dash > 0) s.appendChild(svg('circle', { cx: c, cy: c, r: r, fill: 'none', stroke: color, 'stroke-width': stroke, 'stroke-linecap': 'round', 'stroke-dasharray': dash + ' ' + (circumf - dash), transform: 'rotate(-90 ' + c + ' ' + c + ')' }));
    var txt = svg('text', { x: c, y: c + (opts.fontSize ? opts.fontSize * 0.35 : 5), 'text-anchor': 'middle', 'font-size': opts.fontSize || 15, 'font-weight': 'bold' });
    txt.textContent = (opts.centerText !== undefined) ? opts.centerText : (Math.round(p) + ' %');
    s.appendChild(txt);
    return s;
  }

  // Bande de rangs (alignement priorisation) : axe 1 → N, un point par
  // projet actif classé (couleur = sémaphore global), zone top « seuil »
  // grisée, survol = projet. Largeur calée sur le conteneur réel (viewBox
  // recalculé à sa largeur mesurée) pour occuper toute la colonne ; points
  // trop proches (< 8 px) empilés verticalement (jitter) plutôt qu'écrasés.
  function rangStripSVG(container, points, seuil, nbClasses) {
    container.innerHTML = '';
    if (!points.length) { container.appendChild(el('p', { class: 'muted small' }, ['Aucun projet actif classé dans ce périmètre.'])); return; }
    var maxN = nbClasses || Math.max.apply(null, points.map(function (p) { return p.rang; })) || 1;
    // clientWidth/offsetWidth valent 0 en environnement de test (jsdom, pas
    // de mise en page réelle) : repli sur 460 dans ce cas uniquement.
    var W = container.clientWidth || container.offsetWidth || 460;
    // Bande verticale réservée au libellé (y 4-14), distincte de la zone
    // grisée et de la colonne d'empilement des points : quel que soit le
    // rang, un jitter ne peut jamais y grimper, donc jamais le recouvrir.
    var H = 90, padL = 16, padR = 16, labelY = 12, zoneTop = 17, axisY = 62, dotR = 4.5, laneStep = 10, maxLanes = 4;
    var s = svg('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H });
    function xOf(r) { return padL + (W - padL - padR) * (Math.max(1, Math.min(maxN, r)) - 1) / (maxN - 1 || 1); }
    var zoneW = xOf(seuil) - padL;
    var zone = svg('rect', { x: padL, y: zoneTop, width: Math.max(0, zoneW), height: axisY + 12 - zoneTop, fill: '#E9EDF0', rx: 2 });
    tip(zone, 'Zone du top ' + seuil + ' (rang 1 à ' + seuil + ' sur ' + maxN + ').');
    s.appendChild(zone);
    var zoneLbl = svg('text', { x: padL, y: labelY, 'font-size': 9, 'font-weight': 'bold', fill: '#5F6B75' });
    zoneLbl.textContent = 'top ' + seuil;
    s.appendChild(zoneLbl);
    s.appendChild(svg('line', { class: 'axis-line', x1: padL, y1: axisY, x2: W - padR, y2: axisY }));
    var ticks = [1, 50, 100, 200, 300, maxN].filter(function (v, i, a) { return v <= maxN && a.indexOf(v) === i; });
    ticks.forEach(function (v, i) {
      var x = xOf(v);
      s.appendChild(svg('line', { x1: x, y1: axisY - 4, x2: x, y2: axisY + 4, stroke: '#C7CDD2', 'stroke-width': 1 }));
      var anchor = (i === 0) ? 'start' : (i === ticks.length - 1) ? 'end' : 'middle';
      var lbl = svg('text', { x: x, y: axisY + 15, 'font-size': 9, 'text-anchor': anchor, fill: '#5F6B75' });
      lbl.textContent = String(v);
      s.appendChild(lbl);
    });
    // Empilement anti-collision : tri par rang, chaque point prend la
    // première « voie » (au-dessus de l'axe) libre à ≥ 8 px des points déjà
    // posés dans cette voie.
    var placed = [];
    points.slice().sort(function (a, b) { return a.rang - b.rang; }).forEach(function (p) {
      var x = xOf(p.rang);
      var lane = 0;
      while (lane < maxLanes && placed.some(function (q) { return q.lane === lane && Math.abs(q.x - x) < 8; })) lane++;
      placed.push({ x: x, lane: lane, p: p });
    });
    placed.forEach(function (pl) {
      var y = axisY - pl.lane * laneStep;
      var g = svg('g', { class: 'mark' });
      g.appendChild(svg('circle', { cx: pl.x, cy: y, r: dotR, fill: semHex(pl.p.color), stroke: '#fff', 'stroke-width': 1.5 }));
      g.appendChild(svg('circle', { class: 'hover-hit', cx: pl.x, cy: y, r: 11 }));
      tip(g, pl.p.label + ' — rang #' + pl.p.rang + '. Sémaphore : ' + Engine.COLOR_LABEL[pl.p.color] + '.');
      s.appendChild(g);
    });
    container.appendChild(s);
  }

  // Carte « Alignement avec la priorisation » (Portefeuille) : 3 chiffres
  // héros + bande de rangs + liste « à proposer » exportable. La carte est
  // rattachée à `host` dès sa création (avant de dessiner la bande de rangs)
  // afin que la mesure de largeur du conteneur SVG reflète la mise en page
  // réelle, plutôt qu'un élément encore détaché du document.
  function buildAlignementCard(host, list, key) {
    var card = el('div', { class: 'card' });
    card.appendChild(cardTitle('Alignement avec la priorisation', 'Compare le portefeuille de projets actifs au classement de l’outil de priorisation PTE (priorisation.csv).'));
    host.appendChild(card);
    if (!DB.priorisation || !DB.priorisation.length) {
      card.appendChild(el('p', { class: 'muted small' }, ['priorisation.csv non importé : alignement non calculable.']));
      return;
    }
    var al = alignementForPerimetre(list, key);
    var body = el('div', { class: 'align-body' });
    card.appendChild(body);

    var heroCol = el('div', { class: 'align-heroes' });
    function heroBox(num, cap, tipText, warn) {
      var box = el('div', { class: 'hero-box align-hero' + (warn ? ' warn' : ''), tabindex: '0' });
      box.appendChild(el('div', { class: 'hero-num', style: 'font-size:26px;' }, [String(num)]));
      box.appendChild(el('div', { class: 'hero-cap' }, [cap]));
      tip(box, tipText);
      heroCol.appendChild(box);
    }
    heroBox(al.nActifsTop + ' / ' + al.nActifsClasses, 'Actifs dans le top ' + al.seuil,
      al.nActifsTop + ' projet(s) actif(s) classé(s) au rang ≤ ' + al.seuil + ', sur ' + al.nActifsClasses + ' projet(s) actif(s) classé(s) (' + al.nNonClasses + ' non classé(s)).');
    heroBox(al.rangMedian === null ? '—' : Math.round(al.rangMedian), 'Rang médian actifs',
      al.rangMedian === null ? 'Aucun projet actif classé dans ce périmètre.' : ('Rang médian (rang_global) des ' + al.nActifsClasses + ' projet(s) actif(s) classé(s).'));
    heroBox(String(al.aProposer.length), 'Top ' + al.seuil + ' sans projet', al.aProposer.length + ' sous-site(s) du top ' + al.seuil + ' sans aucun projet actif dans ce périmètre — à proposer (règle DPTE : proposer et attribuer).', al.aProposer.length > 0);
    body.appendChild(heroCol);

    var stripCol = el('div', { class: 'align-strip' });
    stripCol.appendChild(el('div', { class: 'hero-cap', style: 'text-align:left; margin-bottom:.4em;' }, ['Rang des projets actifs classés']));
    var stripHost = el('div'); stripCol.appendChild(stripHost);
    body.appendChild(stripCol); // rattaché avant le dessin du SVG : la largeur mesurée est celle du rendu réel
    var points = [];
    list.forEach(function (c) {
      var prio = Engine.prioOf(DB, c.projet.numero_projet);
      if (prio.classe) points.push({ rang: prio.rang_global, color: c.global, label: c.projet.numero_projet + ' — ' + c.projet.nom_projet });
    });

  // Bullet chart budget : repère = objectif, barre claire = prévision, barre foncée = dépensé
  function bulletSVG(objectif, prevision, depense, opts) {
    opts = opts || {};
    var W = opts.width || 170, H = opts.height || 26, pad = 3;
    var maxV = Math.max(objectif || 0, prevision || 0, depense || 0, 1) * 1.12;
    var s = svg('svg', { class: 'chart', width: W, height: H, viewBox: '0 0 ' + W + ' ' + H });
    function xw(v) { return (W - 2 * pad) * (v / maxV); }
    s.appendChild(svg('rect', { x: pad, y: H / 2 - 8, width: W - 2 * pad, height: 16, rx: 2, fill: '#EEF1F3' }));
    if (prevision) s.appendChild(svg('rect', { x: pad, y: H / 2 - 8, width: xw(prevision), height: 16, rx: 2, fill: '#7FB6C2' }));
    if (depense) s.appendChild(svg('rect', { x: pad, y: H / 2 - 3, width: xw(depense), height: 6, rx: 2, fill: '#005F73' }));
    if (objectif) s.appendChild(svg('line', { x1: pad + xw(objectif), x2: pad + xw(objectif), y1: H / 2 - 10, y2: H / 2 + 10, stroke: '#2C3E50', 'stroke-width': 2 }));
    return s;
  }

  // Barre empilée horizontale unique — répartition des sémaphores globaux,
  // segments cliquables (boutons, focalisables au clavier).
  function distBar(counts, onClick) {
    var total = counts.vert + counts.orange + counts.rouge + counts.gris;
    var wrap = el('div');
    var bar = el('div', { class: 'distbar' });
    var segEls = {};
    ['vert', 'orange', 'rouge', 'gris'].forEach(function (color) {
      var n = counts[color]; if (!n) return;
      var pct = total ? (100 * n / total) : 0;
      var seg = el('button', { type: 'button', class: 'seg seg-' + color, style: 'width:' + pct + '%;' }, [String(n)]);
      tip(seg, n + ' projet' + (n > 1 ? 's' : '') + ' ' + Engine.COLOR_LABEL[color].toLowerCase() + ' (' + Math.round(pct) + ' %). Cliquer pour filtrer la liste ci-dessous.');
      segEls[color] = seg;
      bar.appendChild(seg);
    });
    var active = null;
    bar.addEventListener('click', function (e) {
      var seg = e.target.closest ? e.target.closest('.seg') : null; if (!seg) return;
      var color = Object.keys(segEls).filter(function (k) { return segEls[k] === seg; })[0];
      active = (active === color) ? null : color;
      Object.keys(segEls).forEach(function (k) { segEls[k].classList.toggle('active', k === active); });
      onClick(active);

    wrap.appendChild(bar);
    var legend = el('div', { class: 'distbar-legend' });
    ['vert', 'orange', 'rouge', 'gris'].forEach(function (color) {
      legend.appendChild(el('span', {}, [el('span', { class: 'sem-dot dot-' + color, style: 'width:8px;height:8px;' }), Engine.COLOR_LABEL[color] + ' (' + counts[color] + ')']));
    });

  // Graphique en barres groupées (objectif / prévision / engagé / dépensé) par année
  function chartFinancesGroupees(container, years, series) {
    container.innerHTML = '';
    var W = Math.max(420, years.length * 120), H = 220, padL = 50, padB = 34, padT = 14, padR = 10;
    var maxV = 1;
    years.forEach(function (y, i) { series.forEach(function (s) { maxV = Math.max(maxV, s.values[i] || 0); }); });
    maxV = maxV * 1.15 || 1;
    var s = svg('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H });
    s.appendChild(svg('line', { class: 'axis-line', x1: padL, y1: H - padB, x2: W - padR, y2: H - padB }));
    for (var g = 0; g <= 4; g++) {
      var yv = maxV * g / 4;
      var yy = H - padB - (H - padB - padT) * g / 4;
      s.appendChild(svg('line', { class: 'gridline', x1: padL, y1: yy, x2: W - padR, y2: yy }));
      var t = svg('text', { x: padL - 6, y: yy + 4, 'font-size': 10, 'text-anchor': 'end' }); t.textContent = fmt(yv); s.appendChild(t);
    }

    var showLabels = barW >= MIN_BAR_LABEL_PX;
    years.forEach(function (y, i) {

      series.forEach(function (ser, j) {
        var v = ser.values[i] || 0;
        var h = (H - padB - padT) * (v / maxV);
        var x = gx + j * (barW + 3);
        var yb = H - padB - h;
        var rect = svg('rect', { class: 'mark', x: x, y: yb, width: barW, height: Math.max(0, h), rx: 2, fill: ser.color });
        tip(rect, ser.name + ' ' + y + ' : ' + fmt(v) + ' kCHF');
        s.appendChild(rect);
        if (v && showLabels) { var lv = svg('text', { x: x + barW / 2, y: yb - 3, 'font-size': 9, 'text-anchor': 'middle' }); lv.textContent = fmt(v); s.appendChild(lv); }
      });
      var lab = svg('text', { x: gx + (groupW - 12) / 2, y: H - padB + 16, 'font-size': 11, 'text-anchor': 'middle' }); lab.textContent = y; s.appendChild(lab);
    });

    container.appendChild(legend);
    if (!showLabels) smallValueTable(container, years, series.map(function (ser) { return { name: ser.name, values: ser.values }; }));
  }

  // Graphique en barres empilées (trajectoire financière pluriannuelle par projet ou portefeuille)
  function chartStackedYears(container, years, stacks, unitLabel) {
    container.innerHTML = '';
    var W = Math.max(420, years.length * 90), H = 240, padL = 55, padB = 34, padT = 14, padR = 10;
    var totals = years.map(function (y, i) { return stacks.reduce(function (acc, st) { return acc + (st.values[i] || 0); }, 0); });
    var maxV = Math.max.apply(null, totals.concat([1])) * 1.15;
    var s = svg('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H });
    s.appendChild(svg('line', { class: 'axis-line', x1: padL, y1: H - padB, x2: W - padR, y2: H - padB }));
    for (var g = 0; g <= 4; g++) {
      var yy = H - padB - (H - padB - padT) * g / 4;
      s.appendChild(svg('line', { class: 'gridline', x1: padL, y1: yy, x2: W - padR, y2: yy }));
      var t = svg('text', { x: padL - 6, y: yy + 4, 'font-size': 10, 'text-anchor': 'end' }); t.textContent = fmt(maxV * g / 4); s.appendChild(t);
    }
    var groupW = (W - padL - padR) / years.length;
    var barW = Math.min(40, groupW - 14);
    var showTotalLabel = barW >= MIN_BAR_LABEL_PX;
    var palette = ['#005F73', '#856EBE', '#1A8554', '#B58900', '#B03A2E', '#2C3E50', '#30E5D9', '#8A8F94'];
    years.forEach(function (y, i) {
      var x = padL + i * groupW + (groupW - barW) / 2;
      var yCursor = H - padB;
      stacks.forEach(function (st, j) {
        var v = st.values[i] || 0;
        if (!v) return;
        var h = (H - padB - padT) * (v / maxV);
        yCursor -= h;
        var rect = svg('rect', { class: 'mark', x: x, y: yCursor, width: barW, height: Math.max(0, h), fill: st.color || palette[j % palette.length] });
        tip(rect, (st.name || '') + ' ' + y + ' : ' + fmt(v) + ' kCHF');
        s.appendChild(rect);
      });
      if (totals[i] && showTotalLabel) { var lv = svg('text', { x: x + barW / 2, y: yCursor - 4, 'font-size': 9, 'text-anchor': 'middle' }); lv.textContent = fmt(totals[i]); s.appendChild(lv); }
      var lab = svg('text', { x: x + barW / 2, y: H - padB + 16, 'font-size': 11, 'text-anchor': 'middle' }); lab.textContent = y; s.appendChild(lab);
    });
    container.appendChild(s);
    var legend = el('div', { class: 'small', style: 'margin-top:.3em;' });
    stacks.forEach(function (st, j) { legend.appendChild(el('span', { class: 'tag', style: 'border-left:8px solid ' + (st.color || palette[j % palette.length]) + ';' }, [st.name])); });
    container.appendChild(legend);
    if (!showTotalLabel) smallValueTable(container, years, [{ name: 'Total (kCHF)', values: totals }], unitLabel);

  // Regroupement des séries pour la « Trajectoire financière » : par
  // portefeuille (RPF) quand le filtre global est « Tout le parc » (sinon un
  // graphique à 35 séries devient un arc-en-ciel illisible), par projet dès
  // qu'un RPF ou un RP précis est sélectionné. Au-delà de 6 séries, les plus
  // petites sont regroupées dans un bucket gris « Autres » — ordre de
  // couleurs catégorielles fixe (dataviz : jamais de rainbow, cap à N séries).
  var FINANCE_PALETTE = ['#005F73', '#856EBE', '#1A8554', '#B58900', '#2C3E50', '#30E5D9'];
  var FINANCE_AUTRES_COLOR = '#8A8F94';
  var FINANCE_MAX_SERIES = 6;
  function financeSeriesTotals(numeroProjets, years) {
    return years.map(function (y) {
      var t = 0;
      DB.finances.forEach(function (f) { if (numeroProjets.indexOf(f.numero_projet) !== -1 && +f.annee === y && (f.nature || '').toLowerCase() === 'prevision') t += Engine.parseNum(f.montant_kchf) || 0; });
      return t;
    });
  }
  function buildFinanceStacks(list, years, byPortfolio) {
    var groupsMap = {}, order = [];
    list.forEach(function (c) {
      var k = byPortfolio ? (c.projet.rpf || 'Hors périmètre') : c.projet.numero_projet;
      if (!groupsMap[k]) { groupsMap[k] = []; order.push(k); }
      groupsMap[k].push(c.projet.numero_projet);
    });
    var items = order.map(function (k) {
      var values = financeSeriesTotals(groupsMap[k], years);
      var total = values.reduce(function (a, b) { return a + b; }, 0);
      return { name: k, values: values, total: total };
    });
    items.sort(function (a, b) { return b.total - a.total; });
    var kept = items, autres = [];
    if (items.length > FINANCE_MAX_SERIES) { kept = items.slice(0, FINANCE_MAX_SERIES - 1); autres = items.slice(FINANCE_MAX_SERIES - 1); }
    var stacks = kept.map(function (it, i) { return { name: it.name, values: it.values, color: FINANCE_PALETTE[i % FINANCE_PALETTE.length] }; });
    if (autres.length) {
      var autresValues = years.map(function (y, i) { return autres.reduce(function (acc, it) { return acc + it.values[i]; }, 0); });
      stacks.push({ name: 'Autres (' + autres.length + ')', values: autresValues, color: FINANCE_AUTRES_COLOR });
    }
    return stacks;
  }

  // Frise des jalons d'un projet (SVG minimaliste + tableau détaillé imprimable)
  function chartFrise(container, jalonsList, gel, params) {
    container.innerHTML = '';
    var items = jalonsList.map(function (j) {
      var dp = Engine.parseDate(j.date_prevue);
      var dr = Engine.parseDate(j.date_realisee);
      var status, color;
      if (dr) { status = 'Réalisé'; color = 'vert'; }
      else if (dp && Engine.dayDiff(gel, dp) > 0) { status = 'En retard'; color = 'rouge'; }
      else if (dp && Engine.dayDiff(dp, gel) <= 60) { status = 'À venir (60 j)'; color = 'orange'; }
      else { status = 'À venir'; color = 'gris'; }
      return { j: j, dp: dp, dr: dr, status: status, color: color };
    }).filter(function (it) { return it.dp; }).sort(function (a, b) { return a.dp - b.dp; });

    if (!items.length) { container.appendChild(el('p', { class: 'muted small' }, ['Aucun jalon daté enregistré pour ce projet.'])); return; }

    var minD = items[0].dp, maxD = items[items.length - 1].dp;
    var span = Math.max(1, Engine.dayDiff(maxD, minD));
    var W = Math.max(480, items.length * 70), H = 90, padL = 20, padR = 20;
    var s = svg('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H });
    s.appendChild(svg('line', { class: 'axis-line', x1: padL, y1: 45, x2: W - padR, y2: 45 }));
    // Au-delà de 8 jalons, un label sur deux (dataviz : labellisation sélective,
    // jamais un texte par point) — le détail complet reste dans le tableau ci-dessous.
    var labelEvery = items.length > 8 ? 2 : 1;
    var lastLabelX = -Infinity;
    items.forEach(function (it, i) {
      var x = padL + (W - padL - padR) * (Engine.dayDiff(it.dp, minD) / span);
      var c = svg('circle', { class: 'mark', cx: x, cy: 45, r: 6, fill: semHex(it.color) });
      tip(c, it.j.libelle + ' — ' + it.status + (it.j.date_prevue ? (' (' + it.j.date_prevue + ')') : ''));
      s.appendChild(c);
      if (i % labelEvery === 0 && x - lastLabelX > 55) {
        var lab = svg('text', { x: x, y: (i % (2 * labelEvery) === 0) ? 30 : 70, 'font-size': 9, 'text-anchor': 'middle' });
        lab.textContent = it.j.libelle.length > 16 ? it.j.libelle.slice(0, 15) + '…' : it.j.libelle;
        s.appendChild(lab);
        lastLabelX = x;
      }
    });
    container.appendChild(s);

    // Sélection des lignes conservées à l'impression (limite : 6 lignes les
    // plus pertinentes) : en retard, puis à venir sous 60 j, puis derniers
    // jalons réalisés (les plus récents d'abord), puis le reste.
    var byCat = { retard: [], venir60: [], realise: [], autre: [] };
    items.forEach(function (it) {
      if (it.status === 'En retard') byCat.retard.push(it);
      else if (it.status === 'À venir (60 j)') byCat.venir60.push(it);
      else if (it.status === 'Réalisé') byCat.realise.push(it);
      else byCat.autre.push(it);
    });
    var realiseRecent = byCat.realise.slice().sort(function (a, b) { return b.dp - a.dp; });
    var pool = byCat.retard.concat(byCat.venir60).concat(realiseRecent).concat(byCat.autre);
    var keepSet = new Set(pool.slice(0, 6).map(function (it) { return it.j; }));
    var nExtra = items.length - keepSet.size;

    var tbl = el('table', { class: 'small' }, [
      el('thead', {}, [el('tr', {}, [el('th', { class: 'no-sort' }, ['Type']), el('th', { class: 'no-sort' }, ['Libellé']), el('th', { class: 'no-sort' }, ['Prévue']), el('th', { class: 'no-sort' }, ['Réalisée']), el('th', { class: 'no-sort' }, ['Statut'])])]),
    ]);
    var tbody = el('tbody');
    items.forEach(function (it) {
      var extra = !keepSet.has(it.j);
      tbody.appendChild(el('tr', { class: 'row-' + it.color + (extra ? ' print-extra' : '') }, [
        el('td', {}, [it.j.type || '']),
        el('td', {}, [it.j.libelle]),
        el('td', {}, [it.j.date_prevue || '—']),
        el('td', {}, [it.j.date_realisee || '—']),
        el('td', {}, [semInline(it.color, it.status)])
      ]));
    });
    if (nExtra > 0) {
      tbody.appendChild(el('tr', { class: 'print-only' }, [el('td', { colspan: 5, class: 'muted' }, ['+ ' + nExtra + ' autres jalons (voir à l\'écran)'])]));
    }
    tbl.appendChild(tbody);
    container.appendChild(tbl);
  }

  // Jalons des 60 prochains jours (multi-projets) — lignes brutes réutilisées
  // par le tableau (Portefeuille) et par la frise (Tableau de bord).
  function jalons60Rows(list, gel) {
    var rows = [];
    list.forEach(function (c) {
      DB.jalons.filter(function (j) { return j.numero_projet === c.projet.numero_projet && !j.date_realisee; }).forEach(function (j) {
        var dp = Engine.parseDate(j.date_prevue);
        if (dp && Engine.dayDiff(dp, gel) >= 0 && Engine.dayDiff(dp, gel) <= 60) rows.push({ c: c, j: j, dp: dp });
      });
    });
    rows.sort(function (a, b) { return a.dp - b.dp; });
    return rows;
  }
  function buildJalons60Table(rows) {
    if (!rows.length) return el('p', { class: 'muted small' }, ['Aucun jalon dans les 60 prochains jours.']);
    var wrap = el('div');
    var tbl = el('table', { class: 'small' }, [el('thead', {}, [el('tr', {}, [el('th', { class: 'no-sort' }, ['Date']), el('th', { class: 'no-sort' }, ['Projet']), el('th', { class: 'no-sort' }, ['Jalon'])])])]);
    var tb = el('tbody');
    var shown = rows.slice(0, 15);
    shown.forEach(function (r) { tb.appendChild(el('tr', {}, [el('td', { class: 'nowrap' }, [r.j.date_prevue]), el('td', {}, [rangBadge(r.c.projet.numero_projet), r.c.projet.numero_projet + ' — ' + r.c.projet.nom_projet]), el('td', {}, [r.j.libelle])])); });
    tbl.appendChild(tb); wrap.appendChild(tbl);
    if (rows.length > shown.length) wrap.appendChild(el('div', { class: 'small muted', style: 'margin-top:.5em;' }, ['+ ' + (rows.length - shown.length) + ' autre(s) jalon(s) dans les 60 jours.']));
    return wrap;
  }
  // Frise horizontale multi-projets pour le tableau de bord : axe hebdomadaire
  // daté (lundis, « JJ.MM »), ligne « aujourd'hui » repérée, jalons colorés
  // selon l'urgence (rouge en retard, ocre sous 14 j, teal au-delà), jalons
  // d'une même semaine empilés verticalement pour rester lisibles, et une
  // ligne de synthèse chiffrée sous le graphique.
  function chartJalonsFrise(container, list, gel) {
    container.innerHTML = '';
    var items = [];
    list.forEach(function (c) {
      DB.jalons.filter(function (j) { return j.numero_projet === c.projet.numero_projet && !j.date_realisee; }).forEach(function (j) {
        var dp = Engine.parseDate(j.date_prevue);
        if (!dp) return;
        var dayOff = Engine.dayDiff(dp, gel);
        if (dayOff > 60) return;
        items.push({ c: c, j: j, dp: dp, dayOff: dayOff });
      });
    });
    var enRetard = items.filter(function (it) { return it.dayOff < 0; }).length;
    var dans14 = items.filter(function (it) { return it.dayOff >= 0 && it.dayOff <= 14; }).length;
    var dans60 = items.filter(function (it) { return it.dayOff >= 0 && it.dayOff <= 60; }).length;
    var synth = el('div', { class: 'frise-synth' }, [
      el('span', { class: 'pill pill-rouge' }, [enRetard + ' en retard']),
      el('span', { class: 'pill pill-ocre' }, [dans14 + ' dans 14 j']),
      el('span', { class: 'pill pill-teal' }, [dans60 + ' dans 60 j'])
    ]);
    if (!items.length) { container.appendChild(el('p', { class: 'muted small' }, ['Aucun jalon dans les 60 prochains jours.'])); container.appendChild(synth); return; }

    function mondayOfUTC(d) { var day = d.getUTCDay(); var diff = (day === 0 ? -6 : 1 - day); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + diff)); }

    var DMIN = Math.min(-14, Math.min.apply(null, items.map(function (it) { return it.dayOff; })));
    DMIN = Math.max(DMIN, -60);
    var DMAX = 60;

    // Empilement par semaine calendaire (lundi de la semaine du jalon)
    var buckets = {}, bucketOrder = [];
    items.forEach(function (it) {
      var mk = mondayOfUTC(it.dp).getTime();
      if (!buckets[mk]) { buckets[mk] = []; bucketOrder.push(mk); }
      buckets[mk].push(it);
    });
    bucketOrder.forEach(function (mk) { buckets[mk].sort(function (a, b) { return a.dp - b.dp; }); });
    // Au-delà de 8 jalons dans une même semaine, les 8 premiers sont
    // affichés et le reste résumé par une étiquette « +n » (avec le détail
    // au survol), pour ne jamais empiler des points hors cadre.
    var CAP_PER_WEEK = 8;

    var pxPerDay = 6, padL = 30, padR = 20, rowGap = 12, ptTop = 22;
    var W = Math.max(480, (DMAX - DMIN) * pxPerDay + padL + padR);
    var axisY = ptTop + (CAP_PER_WEEK - 1) * rowGap + 9 + 12;
    var H = axisY + 34;
    function xOf(dayOff) { var d = Math.max(DMIN, Math.min(DMAX, dayOff)); return padL + (W - padL - padR) * (d - DMIN) / (DMAX - DMIN); }

    var s = svg('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H });
    s.appendChild(svg('line', { class: 'axis-line', x1: padL, y1: axisY, x2: W - padR, y2: axisY }));

    // Graduation hebdomadaire (lundis), étiquette « JJ.MM »
    var firstMonday = mondayOfUTC(new Date(gel.getTime() + DMIN * 86400000));
    for (var wd = firstMonday; Engine.dayDiff(wd, gel) <= DMAX; wd = new Date(wd.getTime() + 7 * 86400000)) {
      var off = Engine.dayDiff(wd, gel);
      if (off < DMIN - 6) continue;
      var gx = xOf(off);
      s.appendChild(svg('line', { class: 'gridline', x1: gx, y1: ptTop - 2, x2: gx, y2: axisY }));
      var lab = svg('text', { x: gx, y: axisY + 14, 'font-size': 11, 'text-anchor': 'middle' });
      lab.textContent = ('0' + wd.getUTCDate()).slice(-2) + '.' + ('0' + (wd.getUTCMonth() + 1)).slice(-2);
      s.appendChild(lab);
    }

    // Ligne « aujourd'hui »
    var tx = xOf(0);
    s.appendChild(svg('line', { x1: tx, y1: 1, x2: tx, y2: axisY, stroke: '#2C3E50', 'stroke-width': 2, 'stroke-dasharray': '2,2' }));
    var tlbl = svg('text', { x: tx, y: 9, 'font-size': 10, 'font-weight': 'bold', 'text-anchor': 'middle' }); tlbl.textContent = 'Aujourd’hui'; s.appendChild(tlbl);

    bucketOrder.forEach(function (mk) {
      var arr = buckets[mk];
      var shown = arr.slice(0, CAP_PER_WEEK);
      var extra = arr.slice(CAP_PER_WEEK);
      shown.forEach(function (it, idx) {
        var x = xOf(it.dayOff);
        var y = axisY - 9 - idx * rowGap;
        var color = it.dayOff < 0 ? '#B03A2E' : (it.dayOff <= 14 ? '#B58900' : '#005F73');
        var g = svg('g', { class: 'mark' });
        g.appendChild(svg('circle', { cx: x, cy: y, r: 6, fill: color, stroke: '#fff', 'stroke-width': 2 }));
        g.appendChild(svg('circle', { class: 'hover-hit', cx: x, cy: y, r: 14 }));
        var statusTxt = it.dayOff < 0 ? ('en retard de ' + (-it.dayOff) + ' j') : ('dans ' + it.dayOff + ' j');
        tip(g, it.c.projet.numero_projet + ' — ' + it.c.projet.nom_projet + ' : ' + it.j.libelle + ' (' + it.j.date_prevue + ', ' + statusTxt + ')');
        s.appendChild(g);
      });
      if (extra.length) {
        var lx = xOf(arr[0].dayOff);
        var ly = axisY - 9 - CAP_PER_WEEK * rowGap - 2;
        // Texte : ocre foncé #8A6500 (contraste ≥ 4.5:1 sur blanc), pas #B58900 réservé aux pastilles/fonds.
        var extraColor = extra.some(function (it) { return it.dayOff < 0; }) ? '#B03A2E' : (extra.some(function (it) { return it.dayOff <= 14; }) ? '#8A6500' : '#005F73');
        var moreLbl = svg('text', { x: lx, y: ly, 'font-size': 10, 'font-weight': 'bold', 'text-anchor': 'middle', fill: extraColor });
        moreLbl.textContent = '+' + extra.length;
        tip(moreLbl, extra.length + ' autre(s) jalon(s) cette semaine : ' + extra.map(function (it) { return it.c.projet.numero_projet + ' — ' + it.j.libelle; }).join(' · '));
        s.appendChild(moreLbl);
      }
    });
    container.appendChild(s);
    container.appendChild(synth);
  }

  // Sparkline 4 mois — mini-bande colorée du sémaphore global dans les lignes
  // de tableau, si l'historique existe.
  function sparklineCellForProject(np, monthsAvail) {
    var last4 = monthsAvail.slice(-4);
    var pr = DB.projets.filter(function (p) { return p.numero_projet === np; })[0];
    var colors = last4.map(function (m) {
      var row = Engine.getSuiviRow(DB, np, m);
      if (!row || !pr) return null;
      return Engine.computeProjectMonth(DB, pr, m, PARAMS).global;
    });
    if (colors.every(function (c) { return c === null; })) return el('td', { class: 'muted small' }, ['—']);
    var span = el('span', { class: 'spark' });
    colors.forEach(function (c) { span.appendChild(el('i', { style: 'background:' + (c ? semHex(c) : '#E1E6E9') + ';' })); });
    var td = el('td', {}, [span]);
    tip(td, 'Sémaphore global des ' + last4.length + ' derniers mois disponibles (' + last4.join(', ') + ').');
    return td;
  }
  function avancementCell(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return el('td', { class: 'muted small' }, ['—']);
    // avancement_pct est stocké en fraction (0.66 = 66 %) — la barre doit
    // utiliser la même échelle que fmtPct (n * 100), pas la fraction brute.
    var pctVal = Math.max(0, Math.min(100, pct * 100));
    var wrap = el('span', { class: 'avanc-cell' });
    wrap.appendChild(el('span', { class: 'mini-bar' }, [el('span', { style: 'width:' + pctVal + '%;' })]));
    wrap.appendChild(el('span', { class: 'avanc-val' }, [fmtPct(pct)]));
    return el('td', {}, [wrap]);
  }
  function tendanceCell(tend) {
    var nonCalc = tend.symbol === '—';
    var cls = tend.symbol === '↑' ? 'trend-up' : (tend.symbol === '↓' ? 'trend-down' : 'trend-flat');
    var td = el('td', {}, [nonCalc ? el('span', { class: 'muted small' }, ['n/a']) : el('span', { class: 'trend ' + cls }, [tend.symbol])]);
    tip(td, nonCalc ? 'Pas de suivi le mois précédent' : tend.label);
    return td;
  }

  // ------------------------------------------------------------------
  // Tuiles KPI
  // ------------------------------------------------------------------
  function kpiTile(label, value, sub, tipText, extraClass) {
    var isObjSub = sub && typeof sub === 'object';
    var isWarn = isObjSub && sub.warn;
    var subText = isObjSub ? sub.text : sub;
    // Couleur de bord gauche selon l'état, uniquement quand un seuil
    // s'applique réellement (sub fourni comme objet {text,warn} ou
    // {text,stateColor}) — jamais sur un sous-texte informatif simple.
    var stateColor = isObjSub ? (sub.stateColor || (isWarn ? 'rouge' : 'vert')) : null;
    var box = el('div', { class: 'kpi' + (extraClass ? ' ' + extraClass : '') + (stateColor ? ' state-' + stateColor : ''), tabindex: '0' }, [
      el('div', { class: 'kpi-label' }, [label]),
      el('div', { class: 'kpi-value' }, [value])
    ]);
    if (sub) box.appendChild(el('div', { class: 'kpi-sub' + (isWarn ? ' warn' : '') }, [subText]));
    if (tipText) tip(box, tipText);
    return box;
  }

  function emptyCard(text) { return el('div', { class: 'card' }, [el('p', { class: 'empty-state' }, [text])]); }

  // ------------------------------------------------------------------
  // Heatmap projets × indicateurs (pastilles) — remplace le tableau feu
  // tricolore texte de la v0.1.
  // ------------------------------------------------------------------
  // Tri de la heatmap : gravité (par défaut) ou rang de priorisation
  // (colonne « Rang », triable au clic sur l'en-tête).
  function heatmapSortedList(list) {
    var arr = list.slice();
    if (STATE.heatmapSort.key === 'rang') {
      arr.sort(function (a, b) {
        var pa = Engine.prioOf(DB, a.projet.numero_projet), pb = Engine.prioOf(DB, b.projet.numero_projet);
        var va = pa.classe ? pa.rang_global : Infinity, vb = pb.classe ? pb.rang_global : Infinity;
        return (va - vb) * STATE.heatmapSort.dir;
      });
    } else {
      arr.sort(function (a, b) { return Engine.SEV[b.global] - Engine.SEV[a.global]; });
    }
    return arr;
  }

  function heatmapTable(list, gel) {
    var monthsAvail = Engine.moisDisponibles(DB);
    var showSpark = monthsAvail.length > 1;
    var sorted = heatmapSortedList(list);
    var headDefs = [
      ['Délais', 'Pastille = sémaphore Délais ; survolez pour la règle appliquée.'],
      ['Livrables', 'Pastille = sémaphore Livrables déclaré.'], ['Dépenses', 'Pastille = sémaphore Dépenses ; survolez pour le détail chiffré.'],
      ['Risques', 'Pastille = sémaphore Risques ; survolez pour le risque dominant.'],
      ['Global', 'Pire des quatre sémaphores. Tableau trié du plus grave au plus favorable.'],
      ['Tendance', 'Comparaison avec le mois précédent.']
    ];
    if (showSpark) headDefs.push(['4 mois', 'Sémaphore global des 4 derniers mois disponibles.']);
    headDefs.push(['Avanc.', 'Avancement déclaré (%).'], ['RP', null], ['Prochain jalon', null]);
    var thProjet = el('th', { class: 'no-sort' }, ['Projet']);
    var thRang = el('th', {}, ['Rang' + (STATE.heatmapSort.key === 'rang' ? (STATE.heatmapSort.dir === 1 ? ' ▲' : ' ▼') : '')]);
    tip(thRang, 'Rang de priorisation PTE du sous-site relié (« — » = non classé). Cliquer pour trier par rang' + (STATE.heatmapSort.key === 'rang' ? ' (inverser l’ordre)' : '') + '.');
    thRang.addEventListener('click', function () {
      if (STATE.heatmapSort.key === 'rang') STATE.heatmapSort.dir *= -1; else { STATE.heatmapSort.key = 'rang'; STATE.heatmapSort.dir = 1; }
      renderPortefeuilleView();
    });
    var restTh = headDefs.map(function (pair) { var th = el('th', { class: 'no-sort' }, [pair[0]]); if (pair[1]) tip(th, pair[1]); return th; });
    var theadRow = el('tr', {}, [thProjet, thRang].concat(restTh));
    var tbl = el('table', { class: 'heatmap-table' }, [el('thead', {}, [theadRow])]);
    var tbody = el('tbody');
    sorted.forEach(function (c) {
      var nj = nextJalon(c.projet.numero_projet, gel);
      function dotCell(key) {
        var s = c.sems[key];
        var inner = el('span', { class: 'cell-inline' }, [el('span', { class: 'heat-dot', style: 'background:' + semHex(s.color) + ';', 'aria-hidden': 'true' })]);
        if (c.ecarts[key]) inner.appendChild(el('span', { class: 'ecart-flag' }, ['écart']));
        var td = el('td', { class: 'cell-tip ' + tintClass(s.color) }, [inner]);
        var label = { delais: 'Délais', livrables: 'Livrables', depenses: 'Dépenses', risques: 'Risques' }[key];
        tip(td, label + ' : ' + s.reason);
        return td;
      }
      var fullName = c.projet.numero_projet + ' — ' + c.projet.nom_projet;
      var nameTd = el('td', { class: 'heat-name' }, [fullName]);
      tip(nameTd, fullName);
      var globalTd = el('td', { class: tintClass(c.global, true) }, [semInline(c.global, null, { tipText: 'Sémaphore global : ' + c.global + '.' })]);
      var tds = [
        nameTd, el('td', {}, [rangBadge(c.projet.numero_projet)]),
        dotCell('delais'), dotCell('livrables'), dotCell('depenses'), dotCell('risques'),
        globalTd, tendanceCell(c.tendance)
      ];
      if (showSpark) tds.push(sparklineCellForProject(c.projet.numero_projet, monthsAvail));
      tds.push(c.suiviRow ? avancementCell(Engine.parseNum(c.suiviRow.avancement_pct)) : el('td', { class: 'muted small' }, ['—']));
      var rpFull = c.projet.rp || '—';
      var rpTd = el('td', { class: 'heat-rp' }, [rpFull.length > 22 ? (rpFull.slice(0, 21) + '…') : rpFull]);
      if (rpFull.length > 22) tip(rpTd, rpFull);
      tds.push(rpTd);
      var jalonTd = nj
        ? el('td', {}, [el('div', { class: 'heat-jalon-lib' }, [nj.libelle]), el('div', { class: 'heat-jalon-date' }, [nj.date_prevue])])
        : el('td', { class: 'muted small' }, ['—']);
      if (nj) tip(jalonTd, nj.libelle + ' (' + nj.date_prevue + ')');
      tds.push(jalonTd);
      var tr = el('tr', { class: 'clickable' }, tds);
      tr.addEventListener('click', function () { STATE.projetSel = c.projet.numero_projet; showView('fiche'); });
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    return tbl;
  }

  function buildRisquesMajeurs(list) {
    var rows = [];
    list.forEach(function (c) { (c.sems.risques.top || []).forEach(function (t) { if (t.score >= PARAMS.risqueOrangeMin) rows.push({ c: c, t: t }); }); });
    rows.sort(function (a, b) { return b.t.score - a.t.score; });

    var tbl = el('table', { class: 'small' }, [el('thead', {}, [el('tr', {}, [el('th', { class: 'no-sort' }, ['Projet']), el('th', { class: 'no-sort' }, ['Risque']), el('th', { class: 'no-sort' }, ['Catégorie']), el('th', { class: 'no-sort' }, ['Score'])])])]);
    var tb = el('tbody');
    rows.forEach(function (r) { tb.appendChild(el('tr', { class: r.t.score >= PARAMS.risqueRougeMin ? 'row-rouge' : 'row-orange' }, [el('td', {}, [r.c.projet.numero_projet]), el('td', {}, [r.t.row.libelle]), el('td', {}, [r.t.row.categorie]), el('td', {}, [r.t.score.toFixed(2)])])); });

  function buildDecisionsOuvertes(numeroProjets, portefeuilles) {
    var rows = DB.decisions.filter(function (d) {
      var okP = !numeroProjets || d.numero_projet === '' || numeroProjets.indexOf(d.numero_projet) !== -1;
      var okPf = !portefeuilles || d.portefeuille === '' || portefeuilles.indexOf(d.portefeuille) !== -1;

    });

    var tb = el('tbody');
    rows.forEach(function (d) { tb.appendChild(el('tr', {}, [el('td', {}, [d.date]), el('td', {}, [d.decision]), el('td', {}, [d.responsable]), el('td', {}, [d.echeance]), el('td', {}, [d.escalade_vers || '—'])])); });
    tbl.appendChild(tb); return tbl;

  function buildKPIBlock(list, annee) {
    var nps = list.map(function (c) { return c.projet.numero_projet; });
    var fin = financeTotals(nps, annee);
    var pte = pteGainsFor(nps);
    var driftSum = 0, driftN = 0;
    list.forEach(function (c) { if (c.sems.delais.glissJours !== null && c.sems.delais.glissJours !== undefined) { driftSum += c.sems.delais.glissJours; driftN++; } });
    var tiles = el('div', { class: 'kpi-tiles' });
    tiles.appendChild(kpiTile('Projets actifs', String(list.length), null, 'Nombre de projets dans ce périmètre pour ' + (STATE.mois || '—') + '.'));
    tiles.appendChild(kpiTile('Budget objectif, kCHF', fmt(fin.objectif), String(annee), 'Somme des objectifs budgétaires ' + annee + ' du périmètre.'));
    tiles.appendChild(kpiTile('Prévision, kCHF', fmt(fin.prevision), String(annee), 'Somme des prévisions budgétaires ' + annee + '.'));
    tiles.appendChild(kpiTile('Dépensé, kCHF', fmt(fin.depense), String(annee), 'Somme des dépenses enregistrées ' + annee + '.'));
    tiles.appendChild(kpiTile('Dérive délais, j', driftN ? String(Math.round(driftSum / driftN)) : '—', null, 'Écart moyen entre fin prévue et fin ré-estimée, sur les projets disposant des deux dates.'));
    tiles.appendChild(kpiTile('Estim. PTE, kCHF', fmt(pte.estim_pte_kchf), pte.n + ' sous-site(s)', 'Estimation financière PTE cumulée des sous-sites reliés à ce périmètre.', 'pte'));
    return tiles;
  }

  // ------------------------------------------------------------------

    input.addEventListener('change', function (e) { handleFiles(Array.prototype.slice.call(e.target.files || [])); e.target.value = ''; });

    ['dragenter', 'dragover'].forEach(function (ev) { box.addEventListener(ev, function (e) { e.preventDefault(); box.classList.add('dragover'); }); });

      });
      box.appendChild(pillsWrap);
      box.appendChild(el('p', { class: 'muted small', style: 'margin:.6em 0 0;' }, ['Aucun autre CSV n’est accepté (l’ancien flux à 9 fichiers a disparu au profit du classeur unique).']));
    }
    return box;
  }

        el('span', { class: 'wl-meta' }, [(c.projet.rp || '—') + ' · ' + (nj ? nj.libelle : 'aucun jalon')])
      ]);
      tip(li, fullName + '. ' + motif + '. RP : ' + (c.projet.rp || 'non attribué') + '.' + (nj ? (' Prochain jalon : ' + nj.libelle + ' (' + nj.date_prevue + ').') : ''));
      li.addEventListener('click', function () { STATE.projetSel = c.projet.numero_projet; showView('fiche'); });
      ul.appendChild(li);
    });
    container.appendChild(ul);
  }

  // ==================================================================
  // VUE : Reporting — lecture « d'un seul coup d'œil » à tous les
  // niveaux (Programme → Portefeuille → Projet), inspirée des tableaux
  // de bord QlikSense de la DGFE, charte OCBA.
  //
  // Source : la situation financière et le statut GE-Invest par projet
  // (DB.gei, alimenté par la feuille GEI_Suivi du classeur) ; repli
  // automatique sur DB.finances si la feuille n'est pas chargée.
  // ==================================================================

  // ---- Données : une ligne par projet, situation consolidée ----------
  function repRows() {
    var latestSuivi = {};
    DB.suivi.forEach(function (s) {
      var cur = latestSuivi[s.numero_projet];
      if (!cur || s.mois > cur.mois) latestSuivi[s.numero_projet] = s;
    });
    return DB.projets.map(function (p) {
      var g = (DB.gei && DB.gei[p.numero_projet]) || null;
      var s = latestSuivi[p.numero_projet] || null;
      var row = {
        p: p, g: g, s: s,
        pf: (p.rpf && p.rpf.trim()) || 'Sans portefeuille',
        statut: (g && g.statut) || p.statut || '—',
        perf: (g && g.perf) || (s && s.semaphore_performance) || '',
        avancement: (g && g.avancement !== null && g.avancement !== undefined) ? g.avancement
          : (s && Engine.parseNum(s.avancement_pct) !== null ? Engine.parseNum(s.avancement_pct) * 100 : null),
        credit: g ? g.credit : Engine.parseNum(p.credit_total_kchf),
        cumulN1: g ? g.cumulN1 : null, comptaN: g ? g.comptaN : null,
        engage: g ? g.engage : null, budgetN: g ? g.budgetN : null,
        prev: g ? g.prev.slice() : [], prevSuiv: g ? g.prevSuiv : null,
        anneeRef: g ? g.anneeRef : currentYear()
      };
      if (!g) { // repli : reconstruire la situation depuis DB.finances
        var N = currentYear(); row.anneeRef = N; row.prev = [];
        DB.finances.forEach(function (f) {
          if (f.numero_projet !== p.numero_projet) return;
          var v = Engine.parseNum(f.montant_kchf) || 0;
          var an = +f.annee; var nat = (f.nature || '').trim().toLowerCase();
          if (nat === 'depense' || nat === 'dépense') {
            if (an < N) row.cumulN1 = (row.cumulN1 || 0) + v;
            else if (an === N) row.comptaN = (row.comptaN || 0) + v;
          } else if (nat === 'engage' || nat === 'engagé') {
            if (an === N) row.engage = (row.engage || 0) + v;
          } else if (nat === 'objectif' && an === N) {
            row.budgetN = (row.budgetN || 0) + v;
          } else if (nat === 'prevision' || nat === 'prévision') {
            var k = an - N;
            if (k >= 0 && k <= 11) row.prev[k] = (row.prev[k] || 0) + v;
            else if (k > 11) row.prevSuiv = (row.prevSuiv || 0) + v;
          }
        });
      }
      return row;
    });
  }

  function repFilterRows(rows, ignorePf) {
    var f = STATE.rep;
    return rows.filter(function (r) {
      if (!ignorePf && f.pf && r.pf !== f.pf) return false;
      if (f.rp && (r.p.rp || '') !== f.rp) return false;
      if (f.statut && r.statut !== f.statut) return false;
      if (f.type === 'etude' && r.p.projet_etude !== 'oui') return false;
      if (f.type === 'realisation' && r.p.projet_etude === 'oui') return false;
      if (f.q) {
        var hay = (r.p.numero_projet + ' ' + r.p.nom_projet + ' ' + (r.p.numero_sous_site || '') + ' ' + (r.p.nom_sous_site || '') + ' ' + (r.p.rp || '')).toLowerCase();
        if (hay.indexOf(f.q.toLowerCase()) === -1) return false;
      }
      return true;
    });
  }

  function repAgg(rows) {
    var a = { n: rows.length, credit: 0, cumulN1: 0, comptaN: 0, engage: 0, budgetN: 0, prev: [], prevSuiv: 0, avSum: 0, avW: 0, perfCounts: { vert: 0, orange: 0, rouge: 0, gris: 0 }, anneeRef: currentYear() };
    rows.forEach(function (r) {
      if (r.anneeRef) a.anneeRef = r.anneeRef;
      a.credit += r.credit || 0; a.cumulN1 += r.cumulN1 || 0; a.comptaN += r.comptaN || 0;
      a.engage += r.engage || 0; a.budgetN += r.budgetN || 0; a.prevSuiv += r.prevSuiv || 0;
      (r.prev || []).forEach(function (v, i) { a.prev[i] = (a.prev[i] || 0) + (v || 0); });
      var w = (r.credit || 0) > 0 ? r.credit : 1;
      if (r.avancement !== null && r.avancement !== undefined) { a.avSum += r.avancement * w; a.avW += w; }
      var c = Engine.mapPerfGlobale(r.perf) || 'gris';
      a.perfCounts[c]++;
    });
    a.avancement = a.avW ? a.avSum / a.avW : null;
    a.depenseCumul = a.cumulN1 + a.comptaN;
    var reste = a.prevSuiv;
    for (var i = 1; i < a.prev.length; i++) reste += a.prev[i] || 0;
    a.resteAPrevoir = reste;
    return a;
  }

  var PERF_LABEL = { vert: 'Sous-contrôle', orange: 'À surveiller', rouge: 'Critique', gris: 'Non renseigné' };

  function perfSem(perfRaw) {
    var c = Engine.mapPerfGlobale(perfRaw) || 'gris';
    return semInline(c, perfRaw || 'Non renseigné', { small: true });
  }

  // Mini barre de répartition des performances déclarées (vert/orange/rouge/gris)
  function perfDistMini(counts, total) {
    var wrap = el('span', { class: 'dist-mini' });
    ['vert', 'orange', 'rouge', 'gris'].forEach(function (c) {
      if (!counts[c]) return;
      var seg = el('span', { class: 'seg seg-' + c, style: 'flex:' + counts[c] + ';' });
      tip(seg, counts[c] + ' / ' + total + ' projet(s) « ' + PERF_LABEL[c] + ' ».');
      wrap.appendChild(seg);
    });
    return wrap;
  }

  function fmtK(v) { return v === null || v === undefined ? '—' : fmt(Math.round(v)); }

  // ---- Graphique « Situation financière » (SVG, un seul axe, kCHF) ---
  // Barres : Réalisé (teal plein, foncé) puis Prévision (même teinte
  // claire + hachures = « pas encore réel ») — dégradé séquentiel d'une
  // seule teinte, légende + libellés directs. Ligne : trajectoire
  // cumulée. Ligne tiretée : crédit total voté (référence).
  function repChart(agg, opts) {
    opts = opts || {};
    var N = agg.anneeRef;
    var cats = []; // {label, realise, prevision}
    if (agg.cumulN1) cats.push({ label: '≤ ' + (N - 1), realise: agg.cumulN1, prevision: null });
    var lastPrev = -1;
    for (var i = 0; i < 12; i++) if (agg.prev[i]) lastPrev = i;
    var horizon = Math.max(lastPrev, 0);
    for (var k = 0; k <= horizon; k++) {
      cats.push({ label: String(N + k), realise: k === 0 ? (agg.comptaN || null) : null, prevision: agg.prev[k] || null });
    }
    if (agg.prevSuiv) cats.push({ label: '> ' + (N + horizon), realise: null, prevision: agg.prevSuiv });
    if (!cats.length) return emptyCard('Aucune donnée financière pour ce périmètre.');

    // trajectoire cumulée : réalisé, puis prévisions restantes
    var cum = 0; var cumPts = [];
    cats.forEach(function (c, idx) {
      var flux = (idx === 0 && c.label.indexOf('≤') === 0) ? c.realise
        : (c.prevision !== null ? c.prevision : (c.realise || 0));
      cum += flux || 0;
      cumPts.push(cum);
    });
    var yMax = Math.max(agg.credit || 0, cum, 1) * 1.1;

    var W = 940, H = 300, padL = 66, padR = 16, padT = 26, padB = 40;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var svgNS = 'http://www.w3.org/2000/svg';
    function sv(tag, attrs) { var e = document.createElementNS(svgNS, tag); if (attrs) Object.keys(attrs).forEach(function (a) { e.setAttribute(a, attrs[a]); }); return e; }
    function y(v) { return padT + plotH * (1 - v / yMax); }
    var svg = sv('svg', { class: 'chart rep-chart', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Situation financière en kilofrancs par année : réalisé, prévisions, trajectoire cumulée et crédit total.' });

    // hachures « prévision »
    var defs = sv('defs');
    var pat = sv('pattern', { id: 'rep-hatch', width: '6', height: '6', patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
    pat.appendChild(sv('rect', { width: '6', height: '6', fill: '#CFE3E8' }));
    pat.appendChild(sv('rect', { width: '2.4', height: '6', fill: '#7FAAB6' }));
    defs.appendChild(pat);
    svg.appendChild(defs);

    // grille horizontale discrète + axe Y
    var ticks = 4;
    for (var t = 0; t <= ticks; t++) {
      var vv = yMax * t / ticks;
      svg.appendChild(sv('line', { x1: padL, x2: W - padR, y1: y(vv), y2: y(vv), stroke: '#E1E6E9', 'stroke-width': '1' }));
      var lbl = sv('text', { x: padL - 8, y: y(vv) + 4, 'text-anchor': 'end', 'font-size': '11', fill: '#5F6B75' });
      lbl.textContent = fmtCompact(Math.round(vv));
      svg.appendChild(lbl);
    }

    var n = cats.length;
    var slot = plotW / n;
    var barW = Math.min(34, slot * 0.42);
    cats.forEach(function (c, idx) {
      var cx = padL + slot * idx + slot / 2;
      var pair = (c.realise !== null && c.prevision !== null);
      [['realise', '#005F73', 'Réalisé (dépensé)'], ['prevision', 'url(#rep-hatch)', 'Prévision']].forEach(function (def) {
        var v = c[def[0]];
        if (v === null || !v) return;
        var bx = pair ? (def[0] === 'realise' ? cx - barW - 1 : cx + 1) : cx - barW / 2;
        var bh = Math.max(2, plotH * v / yMax);
        var r = sv('rect', { x: bx, y: y(v), width: barW, height: bh, rx: '3', fill: def[1], stroke: def[0] === 'prevision' ? '#7FAAB6' : 'none', 'stroke-width': def[0] === 'prevision' ? '1' : '0' });
        tip(r, c.label + ' — ' + def[2] + ' : ' + fmt(Math.round(v)) + ' kCHF.');
        svg.appendChild(r);
      });
      var xl = sv('text', { x: cx, y: H - padB + 16, 'text-anchor': 'middle', 'font-size': '11', fill: '#5F6B75' });
      xl.textContent = c.label;
      svg.appendChild(xl);
    });

    // ligne trajectoire cumulée
    var pts = cumPts.map(function (v, idx) { return (padL + slot * idx + slot / 2) + ',' + y(v); }).join(' ');
    svg.appendChild(sv('polyline', { points: pts, fill: 'none', stroke: '#2C3E50', 'stroke-width': '2' }));
    cumPts.forEach(function (v, idx) {
      var c = sv('circle', { cx: padL + slot * idx + slot / 2, cy: y(v), r: '3.5', fill: '#2C3E50', stroke: '#fff', 'stroke-width': '1.5' });
      tip(c, cats[idx].label + ' — cumul projeté : ' + fmt(Math.round(v)) + ' kCHF.');
      svg.appendChild(c);
    });
    // libellé direct du dernier point
    var lastLbl = sv('text', { x: Math.min(padL + slot * (n - 1) + slot / 2 + 6, W - padR - 4), y: y(cumPts[n - 1]) - 8, 'text-anchor': 'end', 'font-size': '11', 'font-weight': 'bold', fill: '#2C3E50' });
    lastLbl.textContent = fmtCompact(Math.round(cumPts[n - 1]));
    svg.appendChild(lastLbl);

    // crédit total voté (référence, tiretée)
    if (agg.credit) {
      svg.appendChild(sv('line', { x1: padL, x2: W - padR, y1: y(agg.credit), y2: y(agg.credit), stroke: '#B03A2E', 'stroke-width': '1.6', 'stroke-dasharray': '6 4' }));
      var cl = sv('text', { x: W - padR - 4, y: y(agg.credit) - 6, 'text-anchor': 'end', 'font-size': '11', 'font-weight': 'bold', fill: '#B03A2E' });
      cl.textContent = 'Crédit total ' + fmtCompact(Math.round(agg.credit));
      svg.appendChild(cl);
    }

    var legend = el('div', { class: 'rep-legend' }, [
      el('span', {}, [el('span', { class: 'sw', style: 'background:#005F73;' }), 'Réalisé (dépensé)']),
      el('span', {}, [el('span', { class: 'sw sw-hatch' }), 'Prévision']),
      el('span', {}, [el('span', { class: 'sw sw-line' }), 'Cumul projeté']),
      el('span', {}, [el('span', { class: 'sw sw-dash' }), 'Crédit total voté'])
    ]);
    var card = el('div', { class: 'card' }, [
      cardTitle(opts.title || 'Situation financière (kCHF)', 'Flux annuels : dépensé (réalisé) et prévisions GE-Invest, année de référence ' + N + '. Ligne : trajectoire cumulée. Tirets : crédit total voté.'),
      svg, legend
    ]);
    return card;
  }

  // ---- Tableau agrégé générique (par portefeuille / par statut) ------
  function repAggTable(title, tipText, groups, onDrill) {
    var N = groups.length ? groups[0].agg.anneeRef : currentYear();
    function nbSousSites(rows) {
      var set = {};
      rows.forEach(function (r) { set[(r.p.numero_sous_site || '').trim() || ('__p_' + r.p.numero_projet)] = true; });
      return Object.keys(set).length;
    }
    var head = el('tr', {}, [
      el('th', { class: 'no-sort' }, [title]),
      el('th', { class: 'no-sort num' }, ['Sous-sites']),
      el('th', { class: 'no-sort num' }, ['Projets']),
      el('th', { class: 'no-sort' }, ['Performance']),
      el('th', { class: 'no-sort num' }, ['Crédit total']),
      el('th', { class: 'no-sort num' }, ['Dépensé ≤ ' + (N - 1)]),
      el('th', { class: 'no-sort num' }, ['Dépensé ' + N]),
      el('th', { class: 'no-sort num' }, ['Engagé']),
      el('th', { class: 'no-sort num' }, ['Budget ' + N]),
      el('th', { class: 'no-sort num' }, ['Prévision ' + N]),

    ]);

    var tot = repAgg([]);

    groups.forEach(function (gr) {
      var a = gr.agg;
      tot.n += a.n; tot.credit += a.credit; tot.cumulN1 += a.cumulN1; tot.comptaN += a.comptaN;
      tot.engage += a.engage; tot.budgetN += a.budgetN; tot.resteAPrevoir += a.resteAPrevoir;
      tot.prev[0] = (tot.prev[0] || 0) + (a.prev[0] || 0);
      ['vert', 'orange', 'rouge', 'gris'].forEach(function (c) { tot.perfCounts[c] += a.perfCounts[c]; });
      totRows = totRows.concat(gr.rows);
      var tr = el('tr', { class: onDrill ? 'row-link' : '' }, [
        el('td', { class: 'rep-group-name' }, [gr.label]),
        el('td', { class: 'num' }, [String(nbSousSites(gr.rows))]),
        el('td', { class: 'num' }, [String(a.n)]),
        el('td', {}, [perfDistMini(a.perfCounts, a.n)]),
        el('td', { class: 'num' }, [fmtK(a.credit)]),
        el('td', { class: 'num' }, [fmtK(a.cumulN1)]),
        el('td', { class: 'num' }, [fmtK(a.comptaN)]),
        el('td', { class: 'num' }, [fmtK(a.engage)]),
        el('td', { class: 'num' }, [fmtK(a.budgetN)]),
        el('td', { class: 'num' }, [fmtK(a.prev[0])]),
        el('td', { class: 'num' }, [fmtK(a.resteAPrevoir)])
      ]);
      if (onDrill) {
        tip(tr, 'Cliquer pour ouvrir « ' + gr.label + ' ».');
        tr.addEventListener('click', function () { onDrill(gr); });
      }
      tb.appendChild(tr);
    });
    var trTot = el('tr', { class: 'row-total' }, [
      el('td', {}, ['Total']),
      el('td', { class: 'num' }, [String(nbSousSites(totRows))]),
      el('td', { class: 'num' }, [String(tot.n)]),
      el('td', {}, [perfDistMini(tot.perfCounts, tot.n)]),
      el('td', { class: 'num' }, [fmtK(tot.credit)]),
      el('td', { class: 'num' }, [fmtK(tot.cumulN1)]),
      el('td', { class: 'num' }, [fmtK(tot.comptaN)]),
      el('td', { class: 'num' }, [fmtK(tot.engage)]),
      el('td', { class: 'num' }, [fmtK(tot.budgetN)]),
      el('td', { class: 'num' }, [fmtK(tot.prev[0])]),
      el('td', { class: 'num' }, [fmtK(tot.resteAPrevoir)])
    ]);
    tb.appendChild(trTot);
    tbl.appendChild(tb);
    var card = el('div', { class: 'card' }, [cardTitle(title === 'Portefeuille' ? 'Par portefeuille' : 'Par statut de projet', tipText), el('div', { class: 'table-scroll' }, [tbl])]);
    return card;
  }

  function groupBy(rows, keyFn) {
    var map = {}; var order = [];
    rows.forEach(function (r) {
      var k = keyFn(r);
      if (!map[k]) { map[k] = []; order.push(k); }
      map[k].push(r);
    });
    order.sort();
    return order.map(function (k) { return { label: k, rows: map[k], agg: repAgg(map[k]) }; });
  }

  // ---- Regroupement par sous-site ------------------------------------
  // Les RPF travaillent au niveau du sous-site (bâtiment) : plusieurs
  // projets GE-Invest peuvent porter sur le même sous-site, avec pour
  // objectif à terme de les consolider en un seul projet par sous-site.
  // Un projet sans n° de sous-site forme son propre groupe.
  function repSousSiteGroups(rows) {
    var map = {}; var order = [];
    rows.forEach(function (r) {
      var num = (r.p.numero_sous_site || '').trim();
      var key = num || ('__p_' + r.p.numero_projet);
      if (!map[key]) { map[key] = { key: key, num: num, nom: '', rows: [] }; order.push(key); }
      var g = map[key];
      g.rows.push(r);
      if (!g.nom && r.p.nom_sous_site) g.nom = r.p.nom_sous_site;
    });
    return order.map(function (k) {
      var g = map[k];
      g.agg = repAgg(g.rows);
      if (!g.nom) g.nom = g.rows[0].p.nom_projet;
      return g;
    });
  }

  function rpListLabel(rows) {
    var rps = [];
    rows.forEach(function (r) { if (r.p.rp && rps.indexOf(r.p.rp) === -1) rps.push(r.p.rp); });
    if (!rps.length) return '—';
    return rps.length === 1 ? rps[0] : (rps[0] + ' +' + (rps.length - 1));
  }

  // ---- Chaîne financière Estim PTE → DG → Crédit GE-Invest -----------
  // db.planpte doit exister ; renvoie null si le sous-site n'y figure pas.
  function finChainInfo(numero) {
    if (!DB.planpte || !DB.planpte.bySousSite || !numero) return null;
    var pp = DB.planpte.bySousSite[numero];
    if (!pp) return null;
    var hasDG = pp.dg_kchf !== null && pp.dg_kchf !== undefined;
    var ref = hasDG ? pp.dg_kchf : pp.estim_pte_kchf;
    return { pp: pp, estim: pp.estim_pte_kchf, dg: pp.dg_kchf, ref: ref, refLabel: hasDG ? 'DG' : 'Estim PTE' };
  }
  // Cellule « Écart » (crédit GE-Invest vs référence), teintée selon
  // PARAMS.ecartFinOrangePct / ecartFinRougePct. « — » si pas de référence
  // exploitable (nulle, absente ou nulle-zéro) ou pas de crédit.
  function finEcartCell(credit, chain) {
    var td = el('td', { class: 'num fin-ecart' });
    if (!chain || !chain.ref || credit === null || credit === undefined) {
      td.appendChild(document.createTextNode('—'));
      return td;
    }
    var pct = (credit - chain.ref) / chain.ref * 100;
    var abs = Math.abs(pct);
    if (abs > PARAMS.ecartFinRougePct) td.className += ' tint-rouge';
    else if (abs > PARAMS.ecartFinOrangePct) td.className += ' tint-orange';
    td.appendChild(document.createTextNode((pct >= 0 ? '+' : '−') + Math.round(abs) + ' %'));
    tip(td, 'Estim PTE ' + fmtK(chain.estim) + ' kCHF → DG ' + (chain.dg === null || chain.dg === undefined ? '(non renseigné)' : fmtK(chain.dg) + ' kCHF') +
      ' → Crédit GE-Invest ' + fmtK(credit) + ' kCHF. Référence de l\'écart : ' + chain.refLabel + '.');
    return td;
  }

  // ---- Tableau des sous-sites, dépliable vers les projets ------------
  function repSousSitesTable(rows, N) {
    var groups = repSousSiteGroups(rows).sort(function (a, b) { return (b.agg.credit || 0) - (a.agg.credit || 0); });
    var nConsolider = groups.filter(function (g) { return g.rows.length > 1; }).length;
    var hasPP = !!(DB.planpte && DB.planpte.bySousSite);
    var headCells = [
      el('th', { class: 'no-sort' }, ['Sous-site']),
      el('th', { class: 'no-sort num' }, ['Projets']),
      el('th', { class: 'no-sort' }, ['RP']),
      el('th', { class: 'no-sort' }, ['Avanc.']),
      el('th', { class: 'no-sort' }, ['Performance']),
      el('th', { class: 'no-sort num' }, ['Crédit total'])
    ];
    if (hasPP) {
      headCells.push(el('th', { class: 'no-sort num' }, ['Estim PTE']));
      var thEcart = el('th', { class: 'no-sort num' }, ['Écart']);
      tip(thEcart, 'Écart entre le crédit total GE-Invest et la référence financière du sous-site (DG si renseigné, sinon Estim PTE).');
      headCells.push(thEcart);
    }
    headCells.push(el('th', { class: 'no-sort num' }, ['Dépensé cumulé']));
    headCells.push(el('th', { class: 'no-sort num' }, ['Engagé']));
    headCells.push(el('th', { class: 'no-sort num' }, ['Prévision ' + N]));
    var head = el('tr', {}, headCells);
    var tbl = el('table', { class: 'small qtable' }, [el('thead', {}, [head])]);
    var tb = el('tbody');

    function projetRow(r) {
      var nom = r.p.numero_projet + ' — ' + r.p.nom_projet;

  // ---- Gantt sur les dates prévisionnelles des jalons ----------------
  // rowsG : [{ label, tipLabel, debut, fin, jalons: [{prevue, realisee, libelle, projet}] }]
  // Barre = durée (début → fin) ; jalons en marqueurs : rond plein teal =
  // réalisé, losange blanc = prévu, losange rouge = échu non réalisé.
  // Ligne verticale tiretée = aujourd'hui. Un seul axe (temps).
  function repGantt(rowsG, opts) {
    opts = opts || {};
    var today = new Date();
    rowsG = rowsG.filter(function (r) { return r.debut || r.fin || (r.jalons && r.jalons.length); });
    if (!rowsG.length) return null;
    // bornes temporelles
    var tMin = null, tMax = null;
    function seen(dStr) {
      var d = Engine.parseDate(dStr);
      if (!d) return;
      if (!tMin || d < tMin) tMin = d;
      if (!tMax || d > tMax) tMax = d;
    }
    rowsG.forEach(function (r) {
      seen(r.debut); seen(r.fin);
      (r.jalons || []).forEach(function (j) { seen(j.prevue); seen(j.realisee); });
    });
    if (!tMin || !tMax) return null;
    if (today < tMin) tMin = today; if (today > tMax) tMax = today;
    // marge : 2 mois de part et d'autre
    tMin = new Date(tMin.getTime() - 61 * 86400000);
    tMax = new Date(tMax.getTime() + 61 * 86400000);

    var W = 960, padL = 258, padR = 14, padT = 26, padB = 8, rowH = 26;
    var plotW = W - padL - padR;
    var H = padT + rowsG.length * rowH + padB;
    var svgNS = 'http://www.w3.org/2000/svg';
    function sv(tag, attrs) { var e = document.createElementNS(svgNS, tag); if (attrs) Object.keys(attrs).forEach(function (a) { e.setAttribute(a, attrs[a]); }); return e; }
    function x(d) { return padL + plotW * (d.getTime() - tMin.getTime()) / (tMax.getTime() - tMin.getTime()); }
    var svg = sv('svg', { class: 'chart gantt', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': opts.aria || 'Planning des jalons : barres de durée et jalons prévus, réalisés ou en retard.' });

    // grille verticale : 1er janvier de chaque année visible (le libellé
    // d'une année trop proche du libellé « aujourd'hui » est omis)
    var txToday = x(today);
    for (var yy = tMin.getUTCFullYear() + 1; yy <= tMax.getUTCFullYear(); yy++) {
      var d0 = new Date(Date.UTC(yy, 0, 1));
      if (d0 < tMin || d0 > tMax) continue;
      var gx = x(d0);
      svg.appendChild(sv('line', { x1: gx, x2: gx, y1: padT - 4, y2: H - padB, stroke: '#E1E6E9', 'stroke-width': '1' }));
      if (gx > txToday - 8 && gx < txToday + 66) continue;
      var yl = sv('text', { x: gx + 3, y: padT - 10, 'font-size': '10', fill: '#5F6B75' });
      yl.textContent = String(yy);
      svg.appendChild(yl);
    }
    // aujourd'hui
    var tx = txToday;
    svg.appendChild(sv('line', { x1: tx, x2: tx, y1: padT - 4, y2: H - padB, stroke: '#2C3E50', 'stroke-width': '1.4', 'stroke-dasharray': '4 3' }));
    var tl = sv('text', { x: tx + 4, y: padT - 10, 'font-size': '10', 'font-weight': 'bold', fill: '#2C3E50' });
    tl.textContent = "aujourd'hui";
    svg.appendChild(tl);

    rowsG.forEach(function (r, i) {
      var yTop = padT + i * rowH;
      var yc = yTop + rowH / 2;
      if (i % 2 === 1) svg.appendChild(sv('rect', { x: 0, y: yTop, width: W, height: rowH, fill: '#F7F9FA' }));
      // libellé
      var lbl = sv('text', { x: padL - 10, y: yc + 4, 'text-anchor': 'end', 'font-size': '11', fill: '#2C3E50' });
      var short = r.label.length > 40 ? r.label.slice(0, 39) + '…' : r.label;
      lbl.textContent = short;
      tip(lbl, r.tipLabel || r.label);
      svg.appendChild(lbl);
      // barre de durée
      var dDeb = Engine.parseDate(r.debut), dFin = Engine.parseDate(r.fin);
      var jDates = (r.jalons || []).map(function (j) { return Engine.parseDate(j.realisee || j.prevue); }).filter(Boolean);
      if (!dDeb && jDates.length) dDeb = new Date(Math.min.apply(null, jDates));
      if (!dFin && jDates.length) dFin = new Date(Math.max.apply(null, jDates));
      if (dDeb && dFin && dFin > dDeb) {
        var bx = x(dDeb), bw = Math.max(3, x(dFin) - bx);
        var bar = sv('rect', { x: bx, y: yc - 4, width: bw, height: 8, rx: '4', fill: '#C2D6DC' });
        tip(bar, r.label + ' — du ' + r.debut + ' au ' + (r.fin || '?') + '.');
        svg.appendChild(bar);
      }
      // jalons
      (r.jalons || []).forEach(function (j) {
        var d = Engine.parseDate(j.realisee || j.prevue);
        if (!d) return;
        var mx = Math.max(padL + 3, Math.min(W - padR - 3, x(d)));
        var late = !j.realisee && Engine.parseDate(j.prevue) < today;
        var tipTxt = (j.projet ? j.projet + ' — ' : '') + j.libelle + ' : ' +
          (j.realisee ? ('réalisé le ' + j.realisee) : (late ? ('prévu le ' + j.prevue + ' — échu non réalisé') : ('prévu le ' + j.prevue))) + '.';
        var m;
        if (j.realisee) {
          m = sv('circle', { cx: mx, cy: yc, r: '4', fill: '#005F73' });
        } else {
          m = sv('rect', { x: mx - 3.6, y: yc - 3.6, width: 7.2, height: 7.2, transform: 'rotate(45 ' + mx + ' ' + yc + ')', fill: late ? '#B03A2E' : '#fff', stroke: late ? '#B03A2E' : '#2C3E50', 'stroke-width': '1.2' });
        }
        tip(m, tipTxt);
        svg.appendChild(m);
      });
    });

    var legend = el('div', { class: 'rep-legend' }, [
      el('span', {}, [el('span', { class: 'sw', style: 'background:#C2D6DC; border-radius:4px;' }), 'Durée (début → fin)']),
      el('span', {}, [el('span', { class: 'sw sw-dot' }), 'Jalon réalisé']),
      el('span', {}, [el('span', { class: 'sw sw-diamond' }), 'Jalon prévu']),
      el('span', {}, [el('span', { class: 'sw sw-diamond sw-late' }), 'Jalon échu non réalisé']),
      el('span', {}, [el('span', { class: 'sw sw-today' }), "Aujourd'hui"])
    ]);
    var wrap = rowsG.length > 14 ? el('div', { class: 'gantt-scroll' }, [svg]) : svg;
    return el('div', { class: 'card' }, [
      cardTitle(opts.title || 'Planning (jalons)', opts.tipText || 'Gantt sur les dates prévisionnelles des jalons GE-Invest. Barre : durée du sous-site (début le plus tôt → fin la plus tardive de ses projets). Survolez les marqueurs pour le détail.'),
      wrap, legend
    ]);
  }

  // Gantt agrégé par sous-site (niveaux Programme et Portefeuille)
  function repGanttSousSites(rows, opts) {
    var groups = repSousSiteGroups(rows);
    var rowsG = groups.map(function (g) {
      var debut = null, fin = null, jal = [];
      g.rows.forEach(function (r) {
        [r.p.date_debut_prevue, r.s && r.s.date_debut_reel].forEach(function (d) { if (d && (!debut || d < debut)) debut = d; });
        [r.p.date_fin_prevue, r.s && r.s.date_fin_reestimee].forEach(function (d) { if (d && (!fin || d > fin)) fin = d; });
        DB.jalons.forEach(function (j) {
          if (j.numero_projet !== r.p.numero_projet || !j.date_prevue) return;
          jal.push({ prevue: j.date_prevue, realisee: j.date_realisee || '', libelle: j.libelle, projet: g.rows.length > 1 ? r.p.numero_projet : '' });
        });
      });
      var label = (g.num ? g.num + ' — ' : '') + g.nom;
      return { label: label, tipLabel: label + ' (' + g.rows.length + ' projet(s))', debut: debut, fin: fin, jalons: jal, _deb: debut || '9999' };
    }).sort(function (a, b) { return a._deb < b._deb ? -1 : 1; });
    return repGantt(rowsG, opts);
  }

  // Gantt d'un projet : une ligne par phase de jalons (+ ligne projet)
  function repGanttProjet(r) {
    var np = r.p.numero_projet;
    var jal = DB.jalons.filter(function (j) { return j.numero_projet === np && j.date_prevue; });
    if (!jal.length && !r.p.date_debut_prevue) return null;
    var phases = {}; var order = [];
    jal.forEach(function (j) {
      var ph = (j.type || 'Sans phase').trim() || 'Sans phase';
      if (!phases[ph]) { phases[ph] = []; order.push(ph); }
      phases[ph].push({ prevue: j.date_prevue, realisee: j.date_realisee || '', libelle: j.libelle, projet: '' });
    });
    var rowsG = [{
      label: 'Projet', tipLabel: np + ' — ' + r.p.nom_projet,
      debut: (r.s && r.s.date_debut_reel) || r.p.date_debut_prevue,
      fin: (r.s && r.s.date_fin_reestimee) || r.p.date_fin_prevue,
      jalons: []
    }];
    order.map(function (ph) {
      var js = phases[ph].slice().sort(function (a, b) { return a.prevue < b.prevue ? -1 : 1; });
      return { label: ph, debut: js[0].prevue, fin: js[js.length - 1].prevue, jalons: js, _deb: js[0].prevue };
    }).sort(function (a, b) { return a._deb < b._deb ? -1 : 1; }).forEach(function (x) { rowsG.push(x); });
    return repGantt(rowsG, {
      title: 'Planning du projet (jalons par phase)',
      tipText: 'Gantt du projet : ligne « Projet » (début → fin ré-estimée), puis une ligne par phase, bornée par ses jalons.',
      aria: 'Planning du projet : jalons par phase.'
    });
  }

  function repKPIStrip(agg, opts) {
