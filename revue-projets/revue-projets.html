<title>Revue de projets OCBA</title>
<style>
:root{
  --slate:#2C3E50; --teal:#005F73; --green:#1A8554; --turquoise:#30E5D9;
  --purple:#856EBE; --ochre:#B58900; --ochre-text:#8A6500; --red:#B03A2E; --gray:#8A8F94;
  --page-bg:#F4F6F8; --card-bg:#ffffff; --border:#E1E6E9;
  --ink:var(--slate); --ink-70:#5A6B78; --ink-muted:#5F6B75;
  --shadow:0 1px 2px rgba(44,62,80,.06), 0 1px 8px rgba(44,62,80,.05);
  --r:8px;
  /* Fonds teintés des sémaphores — lisibilité d'un coup d'œil, jamais la
     couleur seule sur blanc dans les tableaux denses (deux intensités). */
  --tint-vert:#E6F2EC; --tint-orange:#FBF1D6; --tint-rouge:#F8E3E0; --tint-gris:#EDEFF1;
  --tint-vert-strong:#CFE9DC; --tint-orange-strong:#F5E1A6; --tint-rouge-strong:#F0C6BF; --tint-gris-strong:#DEE2E5;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{background:var(--page-bg);}
body{color:var(--ink); font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:1.45;}
h1,h2,h3,h4{color:var(--ink); font-family:Arial, Helvetica, sans-serif; margin:0 0 .4em; font-weight:bold;}
a{color:var(--teal);}
table{border-collapse:collapse; width:100%;}
th,td{padding:0 .5em; text-align:left; font-size:13px; vertical-align:middle; height:36px;}
th{background:transparent; color:var(--ink-muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:bold; border-bottom:2px solid var(--border); cursor:pointer; white-space:nowrap; height:30px;}
th:hover{color:var(--teal);}
th.no-sort{cursor:default;}
th.no-sort:hover{color:var(--ink-muted);}
tbody tr{border-bottom:1px solid var(--border);}
tbody tr:nth-child(even){background:#FAFBFC;}
button, select, input{font-family:inherit; font-size:13px;}
button{cursor:pointer; background:var(--teal); color:#fff; border:none; border-radius:4px; padding:.5em .9em;}
button.secondary{background:#fff; color:var(--teal); border:1px solid var(--teal);}
button.ghost{background:transparent; color:var(--slate); border:1px solid var(--border);}
button:disabled{opacity:.5; cursor:not-allowed;}
input[type=text], input[type=number], input[type=date], select, textarea{padding:.35em .5em; border:1px solid var(--border); border-radius:4px; width:100%; color:var(--ink); background:#fff;}
label{display:block; font-size:11px; color:var(--ink-muted); margin-bottom:.2em; font-weight:bold; text-transform:uppercase; letter-spacing:.03em;}
.field{margin-bottom:.7em;}
.small{font-size:12px;}
.muted{color:var(--ink-muted);}
.alert-text{color:var(--red); font-weight:bold;}

#app-shell{max-width:1440px; margin:0 auto; padding:0 20px 40px;}

/* ---------------------------------------------------------------- Header */
header.topbar{background:var(--teal); color:#fff; padding:0; position:sticky; top:0; z-index:30; box-shadow:0 3px 0 var(--turquoise);}
header.topbar .bar{max-width:1440px; margin:0 auto; padding:.65em 20px; display:flex; align-items:center; gap:1.4em; flex-wrap:wrap;}
header.topbar h1{color:#fff; font-size:16px; margin:0; white-space:nowrap; font-weight:bold; letter-spacing:.01em;}
header.topbar h1 small{display:block; font-weight:normal; font-size:11px; opacity:.75; letter-spacing:.02em;}
nav.tabs{display:flex; gap:.2em; flex-wrap:wrap;}
nav.tabs button{background:transparent; color:rgba(255,255,255,.82); border:none; border-radius:4px; padding:.55em .9em; font-weight:bold; font-size:13px;}
nav.tabs button:hover{background:rgba(255,255,255,.12); color:#fff;}
nav.tabs button[aria-current="true"]{background:#fff; color:var(--teal);}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:.9em; flex-wrap:wrap;}
.filter-field{display:flex; align-items:center; gap:.4em;}
.filter-field label{color:rgba(255,255,255,.75); margin:0; font-size:10px; white-space:nowrap;}
.topbar-right select{padding:.32em .5em; border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.12); color:#fff; min-width:150px;}
.topbar-right select option{color:#111; background:#fff;}
.btn-help{width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.4); font-weight:bold; padding:0; line-height:26px; text-align:center; flex:none;}
.btn-help:hover{background:#fff; color:var(--teal);}

/* ---------------------------------------------------------------- Layout */
section.view{padding-top:18px;}
section.view[hidden]{display:none;}
.card{background:var(--card-bg); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:var(--r); padding:16px 18px; margin-bottom:16px;}
.card-title{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-70); font-weight:bold; margin:0 0 .8em; display:flex; align-items:center; gap:.35em;}
.card-title .info-icon{margin-left:.1em;}
.card-title .card-title-right{margin-left:auto; font-weight:normal; text-transform:none; letter-spacing:0; font-size:12px; color:var(--ink-muted);}
.grid{display:grid; gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-6{grid-template-columns:repeat(6,1fr);}
@media (max-width:1050px){ .grid.cols-4,.grid.cols-6{grid-template-columns:repeat(2,1fr);} }
@media (max-width:900px){ .grid.cols-2,.grid.cols-3{grid-template-columns:1fr;} }
@media (max-width:640px){ .grid.cols-4,.grid.cols-6{grid-template-columns:1fr;} }
.toolbar{display:flex; gap:.6em; flex-wrap:wrap; align-items:center; margin-bottom:.9em;}
.toolbar-row{display:flex; gap:.6em; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.searchbox{max-width:420px;}
.tag{display:inline-block; background:var(--page-bg); border:1px solid var(--border); border-radius:10px; padding:0 .5em; font-size:11px; margin-right:.2em;}

/* ---------------------------------------------------------------- Tooltip */
.info-icon{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; border:1px solid var(--ink-muted); color:var(--ink-muted); font-size:9px; font-style:normal; font-weight:bold; line-height:1; cursor:help; flex:none; user-select:none;}
.info-icon:hover, .info-icon:focus{border-color:var(--teal); color:var(--teal); outline:none;}
[data-tip]{cursor:help;}
#tooltip-bubble{position:fixed; z-index:1000; max-width:260px; background:var(--slate); color:#fff; font-size:12px; line-height:1.4; padding:6px 10px; border-radius:4px; box-shadow:0 4px 14px rgba(0,0,0,.25); pointer-events:none; opacity:0; transition:opacity .1s; font-weight:normal; text-transform:none; letter-spacing:normal;}
#tooltip-bubble.show{opacity:1;}

/* ---------------------------------------------------------------- Semaphores */
.sem{display:inline-flex; align-items:center; gap:.4em; white-space:nowrap;}
.sem-dot{width:10px; height:10px; border-radius:50%; flex:none; display:inline-block;}
.sem.sem-lg .sem-dot{width:14px; height:14px;}
.sem.sem-hero .sem-dot{width:22px; height:22px;}
.sem-label{font-size:12px; color:var(--ink-70);}
.sem.sem-hero .sem-label{font-size:16px; font-weight:bold; color:var(--ink);}
.dot-vert{background:var(--green);} .dot-orange{background:var(--ochre);} .dot-rouge{background:var(--red);} .dot-gris{background:var(--gray);}
.trend{font-weight:bold; font-size:13px; margin-left:.15em;}
.trend-up{color:var(--green);} .trend-down{color:var(--red);} .trend-flat{color:var(--ink-muted);}
.ecart-flag{font-size:10px; color:var(--purple); border:1px solid var(--purple); border-radius:3px; padding:0 .3em; margin-left:.3em;}
td.cell-tip{cursor:help;}

/* ---------------------------------------------------------------- KPI tiles */
.kpi-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}
.kpi{border:1px solid var(--border); border-radius:var(--r); padding:.8em 1em; background:var(--card-bg); cursor:help;}
.kpi .kpi-label{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; gap:.3em;}
.kpi .kpi-value{font-size:30px; font-weight:bold; color:var(--ink); margin-top:.15em; line-height:1.1;}
.kpi .kpi-value .kpi-unit{font-size:12px; font-weight:normal; color:var(--ink-muted); margin-left:.2em;}
.kpi .kpi-sub{font-size:12px; color:var(--ink-muted); margin-top:.15em;}
.kpi .kpi-sub.warn{color:var(--red); font-weight:bold;}
.kpi.pte{border-color:var(--purple); background:#FAF8FD;}
.kpi.hero{padding:1em 1.2em;}
.kpi.hero .kpi-value{font-size:32px;}
/* Couleur de bord gauche selon l'état, uniquement quand un seuil réel
   s'applique (budget, jalons en retard, décisions échues, alignement). */
.kpi.state-vert{border-left:4px solid var(--green);}
.kpi.state-orange{border-left:4px solid var(--ochre);}
.kpi.state-rouge{border-left:4px solid var(--red);}

/* ---------------------------------------------------------------- Hero row (dashboard) */
.hero-row{display:grid; grid-template-columns:1.1fr 1.6fr 1fr 1fr; gap:16px; align-items:stretch;}
@media (max-width:1050px){ .hero-row{grid-template-columns:1fr 1fr;} }
@media (max-width:640px){ .hero-row{grid-template-columns:1fr;} }
.hero-box{display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:.3em;}
.hero-box .hero-num{font-size:34px; font-weight:bold; color:var(--ink);}
.hero-box .hero-cap{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted);}

/* Stacked distribution bar (semaphore counts) */
.distbar{display:flex; height:28px; border-radius:3px; overflow:hidden; width:100%; border:1px solid var(--border);}
.distbar .seg{display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:bold; min-width:0; cursor:pointer; transition:filter .1s; border-right:2px solid #fff;}
.distbar .seg:last-child{border-right:none;}
.distbar .seg:hover, .distbar .seg.active{filter:brightness(1.12);}
.distbar .seg.seg-vert{background:var(--green);} .distbar .seg.seg-orange{background:var(--ochre);} .distbar .seg.seg-rouge{background:var(--red);} .distbar .seg.seg-gris{background:var(--gray);}
.distbar-legend{display:flex; gap:1.1em; flex-wrap:wrap; margin-top:.5em; font-size:11px; color:var(--ink-70);}
.distbar-legend span{display:inline-flex; align-items:center; gap:.3em;}

/* Donut ring */
.donut-wrap{display:flex; flex-direction:column; align-items:center; gap:.3em; text-align:center;}
.donut-wrap .donut-label{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em;}

/* Bullet chart (budget) */
.bullet-row{display:flex; align-items:center; gap:.6em; margin-bottom:.3em;}
.bullet-row .bullet-lbl{width:64px; font-size:11px; color:var(--ink-muted); flex:none; text-align:right;}
.bullet-track{flex:1; position:relative; height:14px; background:#EEF1F3; border-radius:3px;}
.bullet-fill{position:absolute; top:0; left:0; height:100%; border-radius:3px;}
.bullet-mark{position:absolute; top:-3px; width:2px; height:20px; background:var(--slate);}

/* Mini progress bar (avancement) */
.mini-bar{width:64px; height:6px; background:#E3E7EA; border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:.4em;}
.mini-bar > span{display:block; height:100%; background:#005F73; border-radius:3px;}
/* Cellule Avanc. (Portefeuille) : une seule ligne, largeur fixe, valeur alignée à droite */
.avanc-cell{display:flex; align-items:center; gap:.4em; width:90px; white-space:nowrap;}
.avanc-cell .mini-bar{width:44px; flex:none; margin-right:0;}
.avanc-cell .avanc-val{flex:1 1 auto; text-align:right; font-variant-numeric:tabular-nums;}
.nowrap{white-space:nowrap;}
/* Lignes compactes (objectifs 2030 restants, sous les anneaux) */
.pct-row{display:flex; align-items:center; gap:.5em; padding:.2em 0; font-size:12px;}
.pct-row .pct-row-label{flex:0 0 42%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-70);}
.pct-row .mini-bar{width:auto; flex:1 1 auto; margin-right:0;}
.pct-row .pct-row-val{flex:none; width:38px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-muted);}
.pte-rest{margin-top:.7em; padding-top:.5em; border-top:1px solid var(--border);}
/* Sémaphore déclaré (GE-Invest), affiché sous la pastille calculée — principe P3 */
.sem-declare{display:flex; align-items:center; gap:.35em; font-size:11px; color:var(--ink-muted); margin-top:.3em;}
.sem-declare-dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:none;}
/* Frise des jalons (tableau de bord) : synthèse chiffrée sous le graphique */
.frise-synth{display:flex; gap:.5em; flex-wrap:wrap; margin-top:.5em;}
.frise-synth .pill{font-size:11px; padding:.2em .6em; border-radius:10px; background:var(--page-bg); border:1px solid var(--border);}
.frise-synth .pill-rouge{color:var(--red); border-color:var(--red);}
.frise-synth .pill-ocre{color:var(--ochre-text); border-color:var(--ochre);}
.frise-synth .pill-teal{color:var(--teal); border-color:var(--teal);}

/* Sparkline (4 mois) */
.spark{display:inline-flex; gap:2px; vertical-align:middle;}
.spark i{width:7px; height:16px; border-radius:2px; display:inline-block;}

/* ---------------------------------------------------------------- À traiter list */
.watchlist{list-style:none; margin:0; padding:0;}
.watchlist li{display:flex; align-items:center; gap:.7em; padding:.5em .2em; border-bottom:1px solid var(--border); cursor:pointer;}
.watchlist li:hover{background:var(--page-bg);}
.watchlist li:last-child{border-bottom:none;}
.watchlist .wl-name{font-weight:bold; font-size:13px; flex:1 1 48%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.watchlist .wl-motif{font-size:12px; color:var(--ink-70); flex:1 1 22%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.watchlist .wl-meta{font-size:11px; color:var(--ink-muted); flex:0 0 auto; max-width:175px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ---------------------------------------------------------------- Heatmap dots table */
.heat-dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
.cell-inline{display:inline-flex; align-items:center; gap:.3em; white-space:nowrap;}
.heatmap-table td.cell-tip{min-width:78px;}
/* Fonds teintés des 4 indicateurs + colonne Global (plus soutenu) : la
   ligne se lit comme une bande de couleur, jamais la pastille seule. */
.heatmap-table td, .heatmap-table th{height:34px;}
.heatmap-table .tint-vert{background:var(--tint-vert);}
.heatmap-table .tint-orange{background:var(--tint-orange);}
.heatmap-table .tint-rouge{background:var(--tint-rouge);}
.heatmap-table .tint-gris{background:var(--tint-gris);}
.heatmap-table .tint-vert-strong{background:var(--tint-vert-strong);}
.heatmap-table .tint-orange-strong{background:var(--tint-orange-strong);}
.heatmap-table .tint-rouge-strong{background:var(--tint-rouge-strong);}
.heatmap-table .tint-gris-strong{background:var(--tint-gris-strong);}
.heatmap-table td.heat-name{max-width:32%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:help;}
.heatmap-table td.heat-rp{max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:help;}
.heatmap-table th{cursor:default;}
.heatmap-table th:not(.no-sort){cursor:pointer;}
.heatmap-table th:not(.no-sort):hover{color:var(--teal);}
.heat-jalon-lib{font-size:12px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px;}
.heat-jalon-date{font-size:11px; line-height:1.2; color:var(--ink-muted);}

/* ---------------------------------------------------------------- Rang badge (priorisation PTE) */
.rang-badge{display:inline-flex; align-items:center; justify-content:center; min-width:32px; height:18px; padding:0 6px; border-radius:9px; background:#E3E8EC; color:var(--slate); font-size:11px; font-weight:bold; margin-right:.45em; cursor:help; flex:none; vertical-align:middle;}
.rang-badge.rang-badge-gris{background:var(--tint-gris); color:var(--ink-muted);}

/* ---------------------------------------------------------------- Carte Priorisation PTE (Fiche projet) */
.prio-hero{display:flex; align-items:baseline; gap:.3em; margin-bottom:.7em; cursor:help;}
.prio-hero-num{font-size:30px; font-weight:bold; color:var(--slate);}
.prio-pastilles{display:flex; flex-wrap:wrap; gap:.7em; margin-bottom:.7em;}
.prio-pastille-wrap{display:flex; flex-direction:column; align-items:center; gap:.25em; cursor:help;}
.prio-pastille{width:16px; height:16px; border-radius:50%; border:2px solid var(--purple); background:#fff; display:block;}
.prio-pastille.filled{background:var(--purple);}
.prio-pastille-lbl{font-size:10px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.02em;}
.prio-bars{margin-bottom:.3em;}
.prio-alert{color:var(--ochre-text); font-weight:bold;}

/* ---------------------------------------------------------------- Carte Alignement priorisation (Portefeuille) */
.align-body{display:grid; grid-template-columns:1fr 1.4fr 1.3fr; gap:20px; align-items:start;}
@media (max-width:1050px){ .align-body{grid-template-columns:1fr;} }
.align-heroes{display:flex; flex-direction:column; gap:14px;}
.align-hero{align-items:flex-start; text-align:left; padding:.4em .2em; border-left:4px solid var(--border);}
.align-hero.warn{border-left-color:var(--red);}
.align-strip{min-width:0;}
.align-propose ul.propose-list{list-style:none; margin:0; padding:0;}
.propose-list li{display:flex; flex-direction:column; gap:.2em; padding:.35em 0; border-bottom:1px solid var(--border); cursor:help;}
.propose-list li:last-child{border-bottom:none;}
.propose-name{font-weight:bold; font-size:12px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.propose-meta{font-size:11px; color:var(--ink-muted); width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------------------------------------------------------------- Row severity / click */
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:#EEF6F6;}

/* ---------------------------------------------------------------- PTE box */
.pte-box{border:1px solid var(--purple); background:#FAF8FD;}
.pte-box .card-title{color:var(--purple);}

/* ---------------------------------------------------------------- Dropzone */
.dropzone{border:2px dashed var(--teal); border-radius:var(--r); padding:1.4em; text-align:center; color:var(--ink); background:var(--page-bg);}
.dropzone.dragover{background:#e6f3f4; border-color:var(--purple);}
.dropzone .dz-title{font-weight:bold; font-size:14px; margin-bottom:.6em;}
.dropzone.dz-big{padding:4em 2em; margin:2em 0;}
.dropzone.dz-big .dz-title{font-size:20px; margin-bottom:.8em;}
.dz-pills{display:flex; flex-wrap:wrap; gap:.5em; justify-content:center; margin-top:1.2em;}
.dz-pill{display:inline-flex; align-items:center; gap:.4em; border-radius:12px; padding:.3em .8em; font-size:12px; background:#E2E6E8; color:var(--ink-muted); border:1px solid var(--border);}
.dz-pill .dz-dot{width:8px; height:8px; border-radius:50%; background:var(--gray); flex:none;}
.dz-pill.ok{background:#E8F4EE; color:#0F5C39; border-color:#BFE3D2;}
.dz-pill.ok .dz-dot{background:var(--green);}
.dz-pill-main{font-weight:bold; border-color:var(--teal); color:var(--teal);}
.dz-pill-main.ok{color:#0F5C39;}

/* ------------------------------------------------------------- Reporting */
.rep-toprow{display:flex; align-items:center; gap:1em; flex-wrap:wrap; margin-bottom:14px;}
.rep-crumbs{display:flex; align-items:center; gap:.3em; flex-wrap:wrap;}
.rep-crumbs .crumb{background:transparent; color:var(--teal); border:none; padding:.3em .45em; font-weight:bold; font-size:14px; border-radius:4px;}
.rep-crumbs .crumb:hover{background:#E6EFF1; }
.rep-crumbs .crumb.current{color:var(--ink); cursor:default; background:transparent;}
.rep-crumbs .crumb-sep{color:var(--ink-muted); font-size:15px;}
.filterbar{display:flex; align-items:flex-end; gap:.8em; flex-wrap:wrap; margin-left:auto;}
.filterbar .filter-item{display:flex; flex-direction:column; gap:.15em;}
.filterbar .filter-item label{margin:0;}
.filterbar select, .filterbar input[type=text]{width:auto; min-width:130px; background:#fff;}
.filterbar .filter-search input{min-width:190px;}
.rep-main-grid{display:grid; grid-template-columns:2.2fr 1fr; gap:16px; align-items:stretch;}
@media (max-width:1050px){ .rep-main-grid{grid-template-columns:1fr;} }
.rep-chart{width:100%; height:auto; display:block;}
.rep-legend{display:flex; gap:1.3em; flex-wrap:wrap; margin-top:.6em; font-size:12px; color:var(--ink-70);}
.rep-legend > span{display:inline-flex; align-items:center; gap:.4em;}
.rep-legend .sw{width:14px; height:11px; border-radius:2px; background:#005F73; display:inline-block; flex:none;}
.rep-legend .sw-hatch{background:repeating-linear-gradient(45deg,#CFE3E8 0 3px,#7FAAB6 3px 4.6px); border:1px solid #7FAAB6;}
.rep-legend .sw-line{height:2px; border-radius:0; background:var(--slate); width:18px;}
.rep-legend .sw-dash{height:0; border-top:2px dashed var(--red); background:transparent; width:18px; border-radius:0;}
/* Tableaux denses type Qlik : chiffres alignés à droite, total en gras */
.qtable td.num, .qtable th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.qtable .row-total td{font-weight:bold; border-top:2px solid var(--slate); background:#F1F4F6;}
.qtable tr.row-link{cursor:pointer;}
.qtable tr.row-link:hover td{background:#E9F2F4;}
