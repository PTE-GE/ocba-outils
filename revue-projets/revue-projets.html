<title>Suivre — Pilotage PTE</title>

<body>
<p>Suivre fait désormais partie de la page Pilotage PTE : <a href="../index.html#vue=revue">ouvrir Suivre</a>.</p>
<script>(function () {
  /* l'ancre est recopiée seulement si elle ne contient que les caractères d'une ancre de la page unique */
  var h = String(location.hash || '').replace(/^#/, '');
  if (h.length > 300 || !/^[A-Za-z0-9=&%._~+:!'()*-]*$/.test(h)) h = '';
  h = h.replace(/^vue=[a-z]+&?/, '');
  var q = /[?&]ss=([0-9]{6})(?:&|$)/.exec(location.search || '');
  if (q && !/(?:^|&)ss=/.test(h)) h = 'ss=' + q[1] + (h ? '&' + h : '');
  location.replace('../index.html#vue=revue' + (h ? '&' + h : ''));
})();</script>
</body>
</html>
