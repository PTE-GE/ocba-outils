    function tile(label, value, sub, tipText) { tiles.appendChild(kpiTile(label, value, sub, tipText)); }
    if (opts.sousSites) tile('Sous-sites', String(opts.sousSites), agg.n + ' projet(s)', 'Nombre de sous-sites (bâtiments) du périmètre affiché ; en dessous, le nombre de projets GE-Invest rattachés (objectif à terme : un seul projet par sous-site).');
    else tile('Projets', String(agg.n), null, 'Nombre de projets du périmètre affiché (après filtres).');
    tile('Crédit total, kCHF', fmtK(agg.credit), 'voté', 'Somme des crédits totaux (dépenses) GE-Invest des projets affichés.');
    tile('Dépensé cumulé, kCHF', fmtK(agg.depenseCumul), '≤ ' + (N - 1) + ' : ' + fmtK(agg.cumulN1) + ' · ' + N + ' : ' + fmtK(agg.comptaN), 'Comptabilisé cumulé à fin ' + (N - 1) + ' plus comptabilisé ' + N + '.');
    tile('Engagé, kCHF', fmtK(agg.engage), 'solde', 'Solde engagé (dépenses) au moment de l’extraction.');
    tile('Prévision ' + N + ', kCHF', fmtK(agg.prev[0]), 'budget ' + N + ' : ' + fmtK(agg.budgetN), 'Prévision de dépenses ' + N + ' (GE-Invest) ; en dessous, le budget ' + N + ' alloué.');
    var avTxt = agg.avancement === null ? '—' : Math.round(agg.avancement) + ' %';
    tile('Avancement', avTxt, 'pondéré au crédit', 'Avancement global moyen des projets, pondéré par le crédit total.');
    return tiles;
  }

  function repPerfCard(agg) {
    var total = agg.n || 1;
    var bar = el('div', { class: 'distbar' });
    ['vert', 'orange', 'rouge', 'gris'].forEach(function (c) {
      var v = agg.perfCounts[c];
      if (!v) return;
      var seg = el('div', { class: 'seg seg-' + c, style: 'flex:' + v + ';' }, [v / total >= 0.08 ? String(v) : '']);
      tip(seg, v + ' projet(s) « ' + PERF_LABEL[c] + ' » (performance globale déclarée GE-Invest).');
      bar.appendChild(seg);
    });
    var legend = el('div', { class: 'distbar-legend' });
    ['vert', 'orange', 'rouge', 'gris'].forEach(function (c) {
      legend.appendChild(el('span', {}, [el('span', { class: 'sem-dot dot-' + c }), PERF_LABEL[c] + ' (' + agg.perfCounts[c] + ')']));
    });
    return el('div', { class: 'card' }, [
      cardTitle('Performance globale déclarée', 'Répartition des sémaphores « Performance globale » saisis par les RP dans GE-Invest, sur le périmètre affiché.'),
      bar, legend
    ]);
  }

  // ---- Détail projet ---------------------------------------------------
  function repProjetDetail(rows) {
    var np = STATE.rep.projet;
    var r = rows.filter(function (x) { return x.p.numero_projet === np; })[0];
    var host = el('div');
    if (!r) { host.appendChild(emptyCard('Projet introuvable dans le périmètre courant.')); return host; }
    var agg = repAgg([r]);
    var N = agg.anneeRef;

    // en-tête projet
    var ssNum = (r.p.numero_sous_site || '').trim();
    var headCard = el('div', { class: 'card rep-proj-head' });
    var h2 = el('h2', {}, [r.p.numero_projet + ' — ' + r.p.nom_projet]);
    // Nomenclature (règle applicable aux NOUVEAUX projets seulement) : un nom
    // existant qui ne contient pas le numéro de sous-site n'est jamais renommé.
    if (ssNum && r.p.nom_projet && r.p.nom_projet.indexOf(ssNum) === -1) {
      h2.appendChild(document.createTextNode(' '));
      h2.appendChild(tip(el('span', { class: 'tag' }, ['nom hors nomenclature (existant : ne pas renommer)']),
        'Règle pour les NOUVEAUX projets : LTE - <Nom du sous-site> - <N° sous-site> - <Adresse>. Les noms GE-Invest existants ne changent pas.'));
    }
    var left = el('div', { class: 'rep-proj-id' }, [
      h2,
      el('p', { class: 'muted small' }, [
        (r.p.numero_sous_site ? ('Sous-site ' + r.p.numero_sous_site + (r.p.nom_sous_site ? ' — ' + r.p.nom_sous_site : '')) : 'Sans sous-site'),
        ' · RP : ' + (r.p.rp || '—') + ' · ' + (r.p.projet_etude === 'oui' ? 'Étude' : 'Réalisation') + ' · Statut ' + r.statut
      ])
    ]);
    // Chaîne financière du sous-site (Estim PTE → DG → Crédit GE-Invest)
    var chain = finChainInfo(ssNum);
    if (chain) {
      var creditSS = null;
      rows.forEach(function (x) {
        if ((x.p.numero_sous_site || '').trim() !== ssNum) return;
        if (x.credit === null || x.credit === undefined) return;
        creditSS = (creditSS || 0) + x.credit;
      });
      var chainP = el('p', { class: 'muted small' }, [
        'Chaîne financière du sous-site : Estim PTE ' + fmtK(chain.estim) + ' → DG ' + fmtK(chain.dg) + ' → Crédit GE-Invest ' + fmtK(creditSS) + ' kCHF'
      ]);
      if (chain.ref && creditSS !== null) {
        var pctSS = (creditSS - chain.ref) / chain.ref * 100;
        var txtSS = ' (écart ' + (pctSS >= 0 ? '+' : '−') + Math.round(Math.abs(pctSS)) + ' %)';
        chainP.appendChild(Math.abs(pctSS) > PARAMS.ecartFinRougePct ? el('span', { class: 'alert-text' }, [txtSS]) : document.createTextNode(txtSS));
      }
      tip(chainP, 'L\'Estim PTE (CECB+) donne l\'ordre de grandeur, le Devis général (DG) fige la base du crédit, GE-Invest porte le crédit voté et son exécution. Référence de l\'écart : ' + chain.refLabel + '.');
      left.appendChild(chainP);
      if (chain.pp && chain.pp.nom) {
        left.appendChild(el('p', { class: 'small muted' }, ['Nom recommandé pour un nouveau projet : LTE - ' + chain.pp.nom + ' - ' + ssNum]));
      }
    }
    var right = el('div', { class: 'rep-proj-sems' }, [
      el('div', {}, [perfSem(r.perf)]),
      r.s ? el('div', { class: 'small muted' }, ['Mise à jour : ' + (r.s.date_maj || r.s.mois)]) : el('div', { class: 'small muted' }, ['Aucune fiche de suivi'])
    ]);
    var openBtn = el('button', { type: 'button', class: 'secondary' }, ['Ouvrir la fiche projet complète']);
    openBtn.addEventListener('click', function () { STATE.projetSel = np; showView('fiche'); });
    right.appendChild(openBtn);
    // autres projets du même sous-site (objectif : consolidation)
    if (ssNum) {
      var freres = rows.filter(function (x) { return x.p.numero_projet !== np && (x.p.numero_sous_site || '').trim() === ssNum; });
      if (freres.length) {
        var line = el('p', { class: 'small ss-freres' }, [freres.length + ' autre(s) projet(s) sur ce sous-site (à consolider) : ']);
        freres.forEach(function (x, i) {
          if (i) line.appendChild(document.createTextNode(' · '));
          var a2 = el('a', { href: '#' }, [x.p.numero_projet]);
          tip(a2, x.p.nom_projet);
          a2.addEventListener('click', function (e) { e.preventDefault(); STATE.rep.projet = x.p.numero_projet; renderReportingView(); });
          line.appendChild(a2);
        });
        left.appendChild(line);
      }
    }
    headCard.appendChild(left); headCard.appendChild(right);
    host.appendChild(headCard);

    host.appendChild(repKPIStrip(agg));
    host.appendChild(el('div', { style: 'height:16px;' }));
    host.appendChild(repChart(agg, { title: 'Situation financière du projet (kCHF)' }));
    var ganttP = repGanttProjet(r);
    if (ganttP) host.appendChild(ganttP);

    var twoCol = el('div', { class: 'grid cols-2' });

    // jalons
    var jal = DB.jalons.filter(function (j) { return j.numero_projet === np; })
      .sort(function (a, b) { return (a.date_prevue || '9999') < (b.date_prevue || '9999') ? -1 : 1; });
    var jalCard = el('div', { class: 'card' }, [cardTitle('Jalons (' + jal.length + ')', 'Jalons GE-Invest du projet. En rouge : échus non réalisés.')]);
    if (jal.length) {
      var jt = el('table', { class: 'small' }, [el('thead', {}, [el('tr', {}, [el('th', { class: 'no-sort' }, ['Jalon']), el('th', { class: 'no-sort' }, ['Phase']), el('th', { class: 'no-sort' }, ['Prévu']), el('th', { class: 'no-sort' }, ['Réalisé'])])])]);
      var jtb = el('tbody');
      var today = STATE.mois ? Engine.gelDate(STATE.mois, PARAMS) : new Date();
      jal.forEach(function (j) {
        var dp = Engine.parseDate(j.date_prevue);
        var late = dp && !j.date_realisee && Engine.dayDiff(today, dp) > 0;
        jtb.appendChild(el('tr', { class: late ? 'row-rouge' : '' }, [
          el('td', {}, [j.libelle]), el('td', {}, [j.type || '—']),
          el('td', { class: 'nowrap' }, [j.date_prevue || '—']), el('td', { class: 'nowrap' }, [j.date_realisee || (late ? 'en retard' : '—')])
        ]));
      });
      jt.appendChild(jtb); jalCard.appendChild(el('div', { class: 'table-scroll table-scroll-v' }, [jt]));
    } else jalCard.appendChild(el('p', { class: 'muted small' }, ['Aucun jalon.']));
    twoCol.appendChild(jalCard);

    // livrables
    var liv = (DB.livrables || []).filter(function (l) { return l.numero_projet === np; });
    var livCard = el('div', { class: 'card' }, [cardTitle('Livrables (' + liv.length + ')', 'Livrables GE-Invest du projet, avec avancement et évaluation.')]);
    if (liv.length) {
      var lt = el('table', { class: 'small' }, [el('thead', {}, [el('tr', {}, [el('th', { class: 'no-sort' }, ['Livrable']), el('th', { class: 'no-sort' }, ['Échéance']), el('th', { class: 'no-sort' }, ['Avanc.']), el('th', { class: 'no-sort' }, ['Évaluation'])])])]);
      var ltb = el('tbody');
      liv.slice().sort(function (a, b) { return (a.date_fin || '9999') < (b.date_fin || '9999') ? -1 : 1; }).forEach(function (l) {
        ltb.appendChild(el('tr', {}, [
          tip(el('td', {}, [(l.acronyme || l.numero_livrable || '—')]), l.description || ''),
          el('td', { class: 'nowrap' }, [l.date_fin || '—']),
          el('td', {}, [avancementCell(l.avancement_pct === null ? null : l.avancement_pct / 100)]),
          el('td', {}, [l.evaluation || '—'])
        ]));
      });
      lt.appendChild(ltb); livCard.appendChild(el('div', { class: 'table-scroll table-scroll-v' }, [lt]));
    } else livCard.appendChild(el('p', { class: 'muted small' }, ['Aucun livrable.']));
    twoCol.appendChild(livCard);
    host.appendChild(twoCol);

    // risques + événements
    var twoCol2 = el('div', { class: 'grid cols-2' });
    var rsq = DB.risques.filter(function (x) { return x.numero_projet === np; });
    var rsqCard = el('div', { class: 'card' }, [cardTitle('Risques (' + rsq.length + ')', 'Risques GE-Invest du projet (probabilité × impact).')]);
    if (rsq.length) {
      var rt = el('table', { class: 'small' }, [el('thead', {}, [el('tr', {}, [el('th', { class: 'no-sort' }, ['Risque']), el('th', { class: 'no-sort' }, ['Prob.']), el('th', { class: 'no-sort' }, ['Impact']), el('th', { class: 'no-sort' }, ['Statut'])])])]);
      var rtb = el('tbody');
      rsq.forEach(function (x) {
        rtb.appendChild(el('tr', {}, [
          tip(el('td', {}, [x.libelle || x.acronyme]), (x.description || '') + (x.mesure ? (' Mesure : ' + x.mesure) : '')),
          el('td', {}, [x.probabilite !== '' && x.probabilite !== null ? fmtPct(Engine.parseNum(x.probabilite)) : '—']),
          el('td', {}, [x.impact || '—']),
          el('td', {}, [x.statut || '—'])
        ]));
      });
      rt.appendChild(rtb); rsqCard.appendChild(rt);
    } else rsqCard.appendChild(el('p', { class: 'muted small' }, ['Aucun risque enregistré.']));
    twoCol2.appendChild(rsqCard);

    var evCard = el('div', { class: 'card' }, [cardTitle('Événements marquants', 'Textes saisis par le RP dans la fiche de suivi GE-Invest.')]);
    var hasEv = false;
    [['Positifs', r.s && r.s.evenements_marquants], ['Avec dysfonctionnements', r.s && r.s.evenements_risque], ['Problématiques', r.s && r.s.evenements_problematiques]].forEach(function (pair) {
      if (!pair[1]) return;
      hasEv = true;
      evCard.appendChild(el('h3', { class: 'rep-ev-title' }, [pair[0]]));
      evCard.appendChild(el('p', { class: 'small' }, [pair[1]]));
    });
    if (!hasEv) evCard.appendChild(el('p', { class: 'muted small' }, ['Aucun événement saisi.']));
    twoCol2.appendChild(evCard);
    host.appendChild(twoCol2);
    return host;
  }

  // ---- Rendu principal -------------------------------------------------
  function renderRepBody() {
    var body = $('#rep-body');
    if (!body) return;
    hideTipBubble(); // l'élément survolé peut disparaître au re-rendu (drill)
    body.innerHTML = '';
    var all = repRows();
    var scoped = STATE.rep.pf ? all.filter(function (r) { return r.pf === STATE.rep.pf; }) : all;
    var rows = repFilterRows(scoped);
    var agg = repAgg(rows);
    var N = agg.anneeRef;

    if (STATE.rep.projet) {
      body.appendChild(repProjetDetail(scoped));
      return;
    }

    var nbSS = repSousSiteGroups(rows).length;
    body.appendChild(repKPIStrip(agg, { sousSites: nbSS }));
    body.appendChild(el('div', { style: 'height:16px;' }));

    var mainGrid = el('div', { class: 'rep-main-grid' });
    mainGrid.appendChild(repChart(agg, {}));
    mainGrid.appendChild(repPerfCard(agg));
    body.appendChild(mainGrid);

    var finChainCard = repFinChainCard(rows);
    if (finChainCard) { body.appendChild(el('div', { style: 'height:16px;' })); body.appendChild(finChainCard); }

    if (!STATE.rep.pf) {
      var groupsPf = groupBy(rows, function (r) { return r.pf; });
      body.appendChild(repAggTable('Portefeuille', 'Situation consolidée par portefeuille GE-Invest. Cliquer sur une ligne pour descendre au niveau portefeuille.', groupsPf, function (gr) {
        STATE.rep.pf = gr.label; renderReportingView();
      }));
    }
    var groupsSt = groupBy(rows, function (r) { return r.statut; });
    body.appendChild(repAggTable('Statut', 'Situation consolidée par statut de projet GE-Invest (nombre, crédit, dépenses, engagés, prévisions).', groupsSt, null));

    var gantt = repGanttSousSites(rows, {
      title: STATE.rep.pf ? 'Planning du portefeuille (jalons par sous-site)' : 'Planning du parc (jalons par sous-site)',
      aria: 'Planning des sous-sites : durée et jalons prévus, réalisés ou en retard.'
    });
    if (gantt) body.appendChild(gantt);

    body.appendChild(repSousSitesTable(rows, N));
  }

  function renderReportingView() {
    var host = $('#reporting-content');
    if (!host) return;
    hideTipBubble();
    host.innerHTML = '';
    if (!DB.projets.length) {
      host.appendChild(el('div', { class: 'empty-state' }, [buildDropzone(true)]));
      return;
    }
    var all = repRows();
    var scoped = STATE.rep.pf ? all.filter(function (r) { return r.pf === STATE.rep.pf; }) : all;
    var topRow = el('div', { class: 'rep-toprow no-print' }, [repCrumbs()]);
    if (!STATE.rep.projet) topRow.appendChild(repFilterBar(scoped));
    host.appendChild(topRow);
    host.appendChild(el('div', { id: 'rep-body' }));
    renderRepBody();
  }

  // ------------------------------------------------------------------
  // VUE : Tableau de bord (nouvelle vue d'ouverture)
  // ------------------------------------------------------------------
  function renderDashboardView() {
    var host = $('#dashboard-content'); host.innerHTML = '';
    if (!DB.projets.length) {
      host.appendChild(el('div', { class: 'empty-state' }, [buildDropzone(true)]));
      return;
    }
    if (!STATE.mois) { host.appendChild(emptyCard('Aucun mois de suivi disponible dans les données importées.')); return; }

    var list = projetsByPerimetre(STATE.perimetre);
    var gel = Engine.gelDate(STATE.mois, PARAMS);
    var annee = currentYear();
    var sem = Engine.computePortfolioSemaphore(list, PARAMS);
    var counts = { vert: 0, orange: 0, rouge: 0, gris: 0 }; list.forEach(function (c) { counts[c.global]++; });
    var renseignes = list.filter(function (c) { return c.sems.fraicheur.color === 'vert'; }).length;
    var pctRenseigne = list.length ? Math.round(100 * renseignes / list.length) : 0;

    // Ligne 1 — héros
    var row1 = el('div', { class: 'card' });
    row1.appendChild(cardTitle('Vue d’ensemble — ' + STATE.mois, 'Périmètre : ' + labelPerimetre(STATE.perimetre) + '.'));
    var hero = el('div', { class: 'hero-row' });

    var boxA = el('div', { class: 'hero-box', tabindex: '0' });
    boxA.appendChild(semInline(sem.color, null, { size: 'hero' }));
    boxA.appendChild(el('div', { class: 'hero-cap' }, ['Sémaphore du périmètre']));
    tip(boxA, sem.reason);
    hero.appendChild(boxA);

    var boxB = el('div', { class: 'hero-box', style: 'align-items:stretch; text-align:left;' });
    tip(boxB, counts.vert + ' vert · ' + counts.orange + ' orange · ' + counts.rouge + ' rouge · ' + counts.gris + ' gris. Cliquer un segment filtre la liste « à traiter » ci-dessous.');
    boxB.appendChild(el('div', { class: 'hero-cap', style: 'margin-bottom:.5em;' }, ['Répartition des sémaphores']));
    var watchlistHostRef = null;
    boxB.appendChild(distBar(counts, function (color) { if (watchlistHostRef) renderWatchlist(watchlistHostRef, list, gel, color); }));
    hero.appendChild(boxB);

    var boxC = el('div', { class: 'hero-box', tabindex: '0' });
    boxC.appendChild(donutSVG(pctRenseigne, '#005F73', { size: 64, stroke: 7 }));
    boxC.appendChild(el('div', { class: 'hero-cap' }, ['Complétude']));
    tip(boxC, renseignes + '/' + list.length + ' projets avec suivi saisi pour ' + STATE.mois + '.');
    hero.appendChild(boxC);

    var boxD = el('div', { class: 'hero-box', tabindex: '0' });
    boxD.appendChild(el('div', { class: 'hero-num' }, [String(list.length)]));
    boxD.appendChild(el('div', { class: 'hero-cap' }, ['Projets actifs']));
    tip(boxD, 'Nombre de projets dans le périmètre sélectionné (' + labelPerimetre(STATE.perimetre) + ').');
    hero.appendChild(boxD);

    row1.appendChild(hero);
    host.appendChild(row1);

    // Ligne 2 — 4 tuiles
    var row2 = el('div', { class: 'card' });
    row2.appendChild(cardTitle('Indicateurs clés — ' + annee));
    var tiles = el('div', { class: 'kpi-tiles' });

    var fin = financeTotals(list.map(function (c) { return c.projet.numero_projet; }), annee);
    var budgetState = 'vert';
    if (fin.objectif > 0) {
      var budgetRatio = fin.prevision / fin.objectif, ecartPct = (budgetRatio - 1) * 100;
      if (ecartPct > PARAMS.depensesEcartOrangeMaxPct || budgetRatio * 100 < PARAMS.depensesSousConsoOrangeMinPct) budgetState = 'rouge';
      else if (ecartPct > PARAMS.depensesEcartVertMaxPct || budgetRatio * 100 < PARAMS.depensesSousConsoVertMinPct) budgetState = 'orange';
    }
    var budgetTile = el('div', { class: 'kpi state-' + budgetState, tabindex: '0' });
    budgetTile.appendChild(el('div', { class: 'kpi-label' }, ['Budget ' + annee + ', kCHF']));
    budgetTile.appendChild(bulletSVG(fin.objectif, fin.prevision, fin.depense, { width: 180, height: 24 }));
    budgetTile.appendChild(el('div', { class: 'kpi-sub' }, ['Prévision ' + fmt(fin.prevision) + ' / objectif ' + fmt(fin.objectif)]));
    tip(budgetTile, 'Objectif ' + fmt(fin.objectif) + ' kCHF (repère) · prévision ' + fmt(fin.prevision) + ' kCHF (barre claire) · dépensé ' + fmt(fin.depense) + ' kCHF (barre foncée).');
    tiles.appendChild(budgetTile);

    var rows60 = jalons60Rows(list, gel);
    var enRetard = 0;
    list.forEach(function (c) { DB.jalons.forEach(function (j) { if (j.numero_projet === c.projet.numero_projet && !j.date_realisee) { var dp = Engine.parseDate(j.date_prevue); if (dp && Engine.dayDiff(gel, dp) > 0) enRetard++; } }); });
    tiles.appendChild(kpiTile('Jalons 60 j', String(rows60.length), enRetard ? { text: enRetard + ' en retard', warn: true } : { text: 'Aucun retard', stateColor: 'vert' }, 'Jalons prévus dans les 60 prochains jours. Les jalons déjà en retard sont comptés séparément.'));

    var risquesMajeurs = [];
    list.forEach(function (c) { (c.sems.risques.top || []).forEach(function (t) { if (t.score >= PARAMS.risqueOrangeMin) risquesMajeurs.push({ c: c, t: t }); }); });
    risquesMajeurs.sort(function (a, b) { return b.t.score - a.t.score; });
    var topRisqueTxt = risquesMajeurs.length ? (risquesMajeurs[0].c.projet.numero_projet + ' — ' + risquesMajeurs[0].t.row.libelle + ' (score ' + risquesMajeurs[0].t.score.toFixed(2) + ')') : 'Aucun risque majeur.';
    tiles.appendChild(kpiTile('Risques ouverts', String(risquesMajeurs.length), 'score ≥ ' + PARAMS.risqueOrangeMin, topRisqueTxt));

    var nps = list.map(function (c) { return c.projet.numero_projet; });
    var pfs = list.map(function (c) { return c.projet.rpf; });
    var decRows = DB.decisions.filter(function (d) { return d.statut === 'ouverte' && (nps.indexOf(d.numero_projet) !== -1 || pfs.indexOf(d.portefeuille) !== -1); });
    var echues = decRows.filter(function (d) { return d.echeance && d.echeance < STATE.mois + '-05'; }).length;
    var decTip = decRows.length ? decRows.slice(0, 3).map(function (d) { return d.decision; }).join(' · ') : 'Aucune décision ouverte.';
    tiles.appendChild(kpiTile('Décisions ouvertes', String(decRows.length), echues ? { text: echues + ' échue(s)', warn: true } : { text: 'Aucune échéance dépassée', stateColor: 'vert' }, decTip));

    var alDash = (DB.priorisation && DB.priorisation.length) ? alignementForPerimetre(list, STATE.perimetre) : null;
    var alValue = alDash ? (alDash.nActifsTop + ' / ' + alDash.nActifsClasses) : '—';
    var alSub = alDash
      ? (alDash.aProposer.length ? { text: alDash.aProposer.length + ' du top ' + alDash.seuil + ' sans projet', warn: true } : { text: 'Aucun sous-site du top ' + alDash.seuil + ' sans projet', stateColor: 'vert' })
      : 'priorisation.csv non importé';
    var alTip = alDash
      ? (alDash.nActifsTop + ' projet(s) actif(s) classé(s) au rang ≤ ' + alDash.seuil + ', sur ' + alDash.nActifsClasses + ' projet(s) actif(s) classé(s). ' + alDash.aProposer.length + ' sous-site(s) bien classé(s) de ce périmètre n’ont aucun projet actif.')
      : 'Importez priorisation.csv (export de l’outil de priorisation PTE, onglet Données) pour activer cet indicateur.';
    tiles.appendChild(kpiTile('Alignement priorisation', alValue, alSub, alTip));

    row2.appendChild(tiles);

  function openPanel() {
    renderMethodeView();
    $('#panel-methode').hidden = false;
    $('#panel-backdrop').hidden = false;
    $('#btn-panel-close').focus();
  }
  function closePanel() {
    $('#panel-methode').hidden = true;
    $('#panel-backdrop').hidden = true;
    $('#btn-help').focus();
  }

  // ------------------------------------------------------------------
  // Navigation / rendu global
  // ------------------------------------------------------------------
  function showView(name) {
    $all('section.view').forEach(function (s) { s.hidden = (s.id !== 'view-' + name); });
    $all('#nav-tabs button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.view === name ? 'true' : 'false'); });
    if (name === 'reporting') renderReportingView();
    if (name === 'dashboard') renderDashboardView();
    if (name === 'fiche') { renderFicheSelect(); buildFiche(STATE.projetSel); }
    if (name === 'portefeuille') renderPortefeuilleView();
    if (name === 'parc') renderParcView();
    if (name === 'donnees') renderDonneesView();
  }

  function renderMoisSelect() {
    var sel = $('#sel-mois');
    var moisDisp = Engine.moisDisponibles(DB);
    sel.innerHTML = '';
    if (!moisDisp.length) { sel.appendChild(el('option', {}, ['—'])); return; }
    moisDisp.forEach(function (m) { sel.appendChild(el('option', { value: m }, [m])); });
    sel.value = STATE.mois;
  }

  function renderFiltreSelect() {
    var sel = $('#sel-filtre'); if (!sel) return;
    var prev = STATE.perimetre;
    sel.innerHTML = '';
    sel.appendChild(el('option', { value: 'ALL' }, ['Tout le parc']));
    var rpfs = Array.from(new Set(DB.projets.map(function (p) { return p.rpf; }).filter(function (v) { return v && v.trim(); }))).sort();
    rpfs.forEach(function (r) { sel.appendChild(el('option', { value: 'RPF:' + r }, ['RPF — ' + r])); });
    sel.appendChild(el('option', { value: 'HORS' }, ['Hors périmètre RPF']));
    var rps = Array.from(new Set(DB.projets.map(function (p) { return p.rp; }).filter(function (v) { return v && v.trim(); }))).sort();
    rps.forEach(function (r) { sel.appendChild(el('option', { value: 'RP:' + r }, ['RP — ' + r])); });
    sel.value = prev; if (sel.value !== prev) { STATE.perimetre = 'ALL'; sel.value = 'ALL'; }
  }

  function renderAll() {
    ensureMonth();
    renderMoisSelect();
    renderFiltreSelect();
    var active = $all('#nav-tabs button').filter(function (b) { return b.getAttribute('aria-current') === 'true'; })[0];
    var name = active ? active.dataset.view : 'dashboard';
    showView(name);
  }

  // ------------------------------------------------------------------
  // Câblage des événements (ignoré silencieusement si l'environnement
  // n'a pas de DOM interactif complet, ex. tests)
  // ------------------------------------------------------------------
  function wireEvents() {
    $all('#nav-tabs button').forEach(function (b) { b.addEventListener('click', function () { showView(b.dataset.view); }); });
    $('#sel-mois').addEventListener('change', function (e) { STATE.mois = e.target.value; renderAll(); });
    $('#sel-filtre').addEventListener('change', function (e) { STATE.perimetre = e.target.value; renderAll(); });
    $('#btn-help').addEventListener('click', openPanel);
    $('#btn-panel-close').addEventListener('click', closePanel);
    $('#panel-backdrop').addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#panel-methode') && !$('#panel-methode').hidden) closePanel(); });

    $('#search-projet').addEventListener('input', function () { renderFicheSelect(); buildFiche($('#sel-projet').value); });
    $('#sel-projet').addEventListener('change', function (e) { STATE.projetSel = e.target.value; buildFiche(STATE.projetSel); });
    $('#btn-print-fiche').addEventListener('click', function () { printWithSize('portrait'); });
    $('#btn-export-decisions-fiche').addEventListener('click', exportDecisionsProjet);
    $('#btn-print-portefeuille').addEventListener('click', function () { printWithSize('landscape'); });
    $('#btn-print-parc').addEventListener('click', function () { printWithSize('landscape'); });
    wireTooltips();
  }

  // Lecture robuste de l'encodage : les exports GE-Invest sont en
  // Windows-1252, les CSV « maison » en UTF-8. On tente UTF-8 strict,
  // et on retombe sur Windows-1252 si des octets ne sont pas valides.
  function decodeCSVBuffer(buf) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { return new TextDecoder('windows-1252').decode(buf); }
  }

  // .xlsx/.xlsm reconnus par extension, ou par leur en-tête d'archive ZIP
  // ('PK') quand le fichier a été renommé ou déposé sans extension fiable.
  function isXLSXFile(filename, buf) {
    if (/\.(xlsx|xlsm)$/i.test(String(filename || ''))) return true;
    if (buf && buf.byteLength >= 2) {
      var u = new Uint8Array(buf, 0, 2);
      if (u[0] === 0x50 && u[1] === 0x4B) return true; // 'PK'
    }
    return false;
  }

  // Import du classeur Plan_PTE_optimise.xlsx (fichier unique du système) —
  // pendant de loadCSVText() pour les .xlsx. db.planpte reste petit même si
  // le classeur source est volumineux (~5 Mo) ; la persistance locale est
  // best-effort et ne doit jamais faire échouer un import déjà en mémoire.
  function loadXLSXBuffer(buf, filename) {
    var res;
    try {
      res = Engine.loadXLSX(DB, buf, filename);
    } catch (e) {
      var msg = String((e && e.message) || e);
      DB.meta.files[filename || 'classeur.xlsx'] = { type: null, count: 0, ok: false, error: msg };
      renderAll();
      return { type: null, count: 0, error: msg };
    }
    if (res.type === null) { renderAll(); return res; }
    ensureMonth();
    try { saveState(); } catch (e) { /* stockage indisponible : import conservé en mémoire seulement */ }
    renderAll();
    if (res.detail && res.detail.gei) { showView('reporting'); }
    return res;
  }

  function handleFiles(files) {
    var remaining = files.length;
    if (!remaining) return;
    files.forEach(function (f) {
      var reader = new FileReader();
      reader.onload = function () {
        var buf = reader.result;
        if (isXLSXFile(f.name, buf)) { loadXLSXBuffer(buf, f.name); return; }
        loadCSVText(decodeCSVBuffer(buf), f.name);
      };
      reader.readAsArrayBuffer(f);
    });
  }

  function printWithSize(orientation) {
    var st = $('#pagesize-style');
    st.textContent = '@page{size:A4 ' + orientation + '; margin:12mm;}';
    window.print();
  }

  // ------------------------------------------------------------------
  // API publique (interface + tests automatisés)
  // ------------------------------------------------------------------
  window.App = {
    loadCSVText: loadCSVText,
    loadXLSXBuffer: loadXLSXBuffer,
    clearData: clearData,
    getDB: function () { return DB; },
    getParams: function () { return PARAMS; },
    setParams: function (p) { Object.assign(PARAMS, p); saveState(); renderAll(); },
    getMonth: function () { return STATE.mois; },
    setMonth: function (m) { STATE.mois = m; if (typeof document !== 'undefined') renderAll(); },
    getState: function () { return STATE; },
    computeAll: computeAll,
    getCompleteness: function () { return Engine.computeCompleteness(DB, STATE.mois); },
    getPortfolioSemaphore: function (key) { return Engine.computePortfolioSemaphore(projetsByPerimetre(key), PARAMS); },
    projetsByPerimetre: projetsByPerimetre,
    financeTotals: financeTotals,
    pteGainsFor: pteGainsFor,
    buildCSVString: buildCSVString,
    addDecision: function (d) { DB.decisions.push(d); saveState(); },
    showView: showView,
    renderAll: renderAll,
    openPanel: openPanel,
    closePanel: closePanel,
    selectProjet: function (np) { STATE.projetSel = np; if (typeof document !== 'undefined') buildFiche(np); },
    Engine: Engine
  };

  if (typeof document !== 'undefined') {
    document.addEventListener('DOMContentLoaded', function () {
      loadState();
      wireEvents();
      // Reporting par défaut dès que des données sont chargées ;
      // sinon le Tableau de bord (écran vide avec la zone de dépôt).
      showView(DB.projets.length ? 'reporting' : 'dashboard');
    });
  }
})();
